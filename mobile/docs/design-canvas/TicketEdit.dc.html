<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8300E6}a:hover{color:#643094}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBFAFE; font-family: Poppins, system-ui, sans-serif; color: #14101F">
  <div style="padding: 50px 20px 10px; display: flex; align-items: center; gap: 12px">
    <a href="Ticket.dc.html" aria-label="Back to request" style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(40,10,80,.1); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14101F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div>
      <div style="font-size: 19px; font-weight: 600; line-height: 1.2">Edit claim form</div>
      <div style="font-size: 13px; color: #5E5873">EXP-REQ-75 · Claim Approval</div>
    </div>
  </div>

  <div style="padding: 10px 24px 120px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 15px; font-weight: 600">Budget</span>
      <span style="height: 50px; border: 1.5px solid #E2DCEC; border-radius: 10px; background: #F3F0F8; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: #5E5873">$ 0.00<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9C96AB" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ct" style="font-size: 15px; font-weight: 600">Claim type <span style="color: #C2264B">*</span></label>
      <button id="ct" type="button" style="height: 50px; border: 1.5px solid #643094; border-radius: 10px; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; font: 400 15px Poppins, sans-serif; color: #14101F"><span style="flex: 1; text-align: left">Local travel</span><svg width="12" height="12" viewBox="0 0 24 24" fill="#14101F" aria-hidden="true"><path d="M5 8h14l-7 9z"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 15px; font-weight: 600">Expense date <span style="color: #C2264B">*</span></span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <button type="button" aria-label="Day" style="height: 50px; border: 1.5px solid #643094; border-radius: 10px; background: #FFFFFF; padding: 0 12px; display: flex; align-items: center; font: 400 15px Poppins, sans-serif; color: #14101F"><span style="flex: 1; text-align: left">24</span><svg width="12" height="12" viewBox="0 0 24 24" fill="#14101F" aria-hidden="true"><path d="M5 8h14l-7 9z"></path></svg></button>
        <button type="button" aria-label="Month" style="height: 50px; border: 1.5px solid #643094; border-radius: 10px; background: #FFFFFF; padding: 0 12px; display: flex; align-items: center; font: 400 15px Poppins, sans-serif; color: #14101F"><span style="flex: 1; text-align: left">Oct</span><svg width="12" height="12" viewBox="0 0 24 24" fill="#14101F" aria-hidden="true"><path d="M5 8h14l-7 9z"></path></svg></button>
        <button type="button" aria-label="Year" style="height: 50px; border: 1.5px solid #643094; border-radius: 10px; background: #FFFFFF; padding: 0 12px; display: flex; align-items: center; font: 400 15px Poppins, sans-serif; color: #14101F"><span style="flex: 1; text-align: left">2026</span><svg width="12" height="12" viewBox="0 0 24 24" fill="#14101F" aria-hidden="true"><path d="M5 8h14l-7 9z"></path></svg></button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 15px; font-weight: 600">Amount <span style="color: #C2264B">*</span></span>
      <div style="display: grid; grid-template-columns: 1fr 96px; gap: 10px">
        <input aria-label="Amount" value="42.50" inputmode="decimal" style="height: 50px; border: 2px solid #8300E6; border-radius: 10px; padding: 0 14px; font: 400 15px Poppins, sans-serif; background: #FFFFFF; box-sizing: border-box; min-width: 0">
        <button type="button" aria-label="Currency" style="height: 50px; border: 1.5px solid #643094; border-radius: 10px; background: #FFFFFF; padding: 0 12px; display: flex; align-items: center; font: 400 15px Poppins, sans-serif; color: #14101F"><span style="flex: 1; text-align: left">USD</span><svg width="12" height="12" viewBox="0 0 24 24" fill="#14101F" aria-hidden="true"><path d="M5 8h14l-7 9z"></path></svg></button>
      </div>
      <span style="font-size: 12px; color: #9A4508">Changed from $ 0.00</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pp" style="font-size: 15px; font-weight: 600">Purpose <span style="color: #C2264B">*</span></label>
      <textarea id="pp" rows="3" style="border: 1.5px solid #643094; border-radius: 10px; padding: 12px 14px; font: 400 15px Poppins, sans-serif; color: #14101F; background: #FFFFFF; resize: none">Client site visit</textarea>
    </div>
    <div style="border-radius: 12px; background: #EFFCFD; padding: 10px 12px; font-size: 12px; color: #0A5560; line-height: 1.5">Your changes are saved to EXP-REQ-75 and recorded in History.</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -6px 24px rgba(40,10,80,.08); padding: 14px 16px 30px; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
    <a href="Ticket.dc.html" style="height: 54px; border: 1.5px solid #643094; border-radius: 14px; background: #FFFFFF; color: #643094; font: 600 15px Poppins, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">Cancel</a>
    <a href="Ticket.dc.html" style="height: 54px; border-radius: 14px; background: linear-gradient(90deg, #8300E6, #643094); color: #FFFFFF; font: 600 15px Poppins, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 8px 20px rgba(100,48,148,.3)">Save changes</a>
  </div>
</div>
</x-dc>
