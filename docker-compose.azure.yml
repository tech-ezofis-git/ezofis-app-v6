version: '3.8'

# Multi-container Azure stack. Secrets live in .env.azure (see .env.azure.example).
services:
  app:
    image: ghcr.io/tech-ezofis-git/ezofis-app-v6/app:latest
    ports:
      - "80:80"
    restart: always

  api:
    image: ghcr.io/tech-ezofis-git/ezofis-app-v6/api:latest
    restart: always
    env_file:
      - .env.azure
    environment:
      # TLS is terminated at Azure/nginx; API listens on HTTP :5000.
      ASPNETCORE_ENVIRONMENT: Production
      HttpsRedirection__Enabled: "false"
      Swagger__Enabled: "true"

  agents:
    image: ghcr.io/tech-ezofis-git/ezofis-app-v6/agents:latest
    restart: always
    env_file:
      - .env.azure
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "3"
      EZOFIS_API_BASE: ${EZOFIS_API_BASE:-https://cloud.ezofis.com/api}
      EZOFIS_ENV: ${EZOFIS_ENV:-live}
      EZOFIS_LOGIN_EMAIL: ${EZOFIS_LOGIN_EMAIL}
      EZOFIS_LOGIN_PASSWORD: ${EZOFIS_LOGIN_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      CATALOG_DATABASE_URL: ${CATALOG_DATABASE_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
    depends_on:
      - redis

  redis:
    # Pull via public ECR mirror — App Service GHCR registry creds break
    # anonymous pulls from docker.io/library/*.
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: always
