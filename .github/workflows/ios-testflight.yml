name: iOS build to TestFlight (mobile app)

# Builds mobile/ (Capacitor) on a GitHub macOS runner with Xcode 26 and uploads it to App Store Connect / TestFlight.
# Runs only when asked: push a tag named ios-* (e.g. git tag ios-0.6.1-1 && git push origin ios-0.6.1-1), or
# "Run workflow" in the Actions tab once this file is on the default branch. It never deploys the API or the web app.
#
# Repository secrets (Settings → Secrets and variables → Actions); nothing secret lives in the repo:
#   APPLE_TEAM_ID   Apple Developer Team ID (10 characters, developer.apple.com → Membership details)
#   ASC_KEY_ID      App Store Connect API key ID (Users and Access → Integrations → App Store Connect API, role Admin)
#   ASC_ISSUER_ID   Issuer ID shown on the same page
#   ASC_KEY_P8      Contents of the downloaded AuthKey_XXXXXX.p8 file (the whole text, including the BEGIN/END lines)
# Signing is automatic: Xcode creates the certificate and profile through the API key (-allowProvisioningUpdates).

on:
  push:
    tags:
      - 'ios-*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave empty for 100 + the run number)'
        required: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # The App Store app's last build before V6 was 19 (version 1.0.10), so builds count up from 100.
      - name: Build number
        env:
          INPUT_BUILD: ${{ github.event.inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "BUILD_NUMBER=${INPUT_BUILD:-$((100 + RUN_NUMBER))}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check Xcode (App Store needs Xcode 26 or later)
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then echo "::error::Xcode $major is too old for App Store uploads"; exit 1; fi

      - name: Check secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for s in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!s}" ]; then echo "::error::Repository secret $s is not set"; missing=1; fi
          done
          [ -z "$missing" ]

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # Signs in to the App Store Connect API with the key before the long build, and says which part is wrong
      # if Apple refuses it (Xcode only reports "Communication with Apple failed (401)").
      - name: Check the API key with Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node - <<'JS'
          const crypto = require('crypto');
          const fs = require('fs');
          const keyId = process.env.ASC_KEY_ID.trim();
          const issuer = process.env.ASC_ISSUER_ID.trim();
          const fail = (m) => { console.log('::error::' + m); process.exit(1); };
          if (!/^[A-Z0-9]{10}$/.test(keyId)) fail(`ASC_KEY_ID should be the 10-character Key ID (letters and digits), but it is ${keyId.length} characters long.`);
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(issuer)) fail(`ASC_ISSUER_ID should look like 12345678-1234-1234-1234-123456789abc (${issuer.length} characters found).`);
          let key;
          try { key = crypto.createPrivateKey(fs.readFileSync(process.env.RUNNER_TEMP + '/AuthKey.p8', 'utf8')); }
          catch (e) { fail('ASC_KEY_P8 is not a valid .p8 key: paste the whole file text, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----.'); }
          const b64 = (o) => Buffer.from(typeof o === 'string' ? o : JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const body = b64({ alg: 'ES256', kid: keyId, typ: 'JWT' }) + '.' + b64({ iss: issuer, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' });
          const sig = crypto.sign('sha256', Buffer.from(body), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          (async () => {
            const r = await fetch('https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.ezofis.ezofismobile', { headers: { Authorization: `Bearer ${body}.${sig}` } });
            const j = await r.json().catch(() => ({}));
            const why = (j.errors || []).map((e) => `${e.code}: ${e.detail || e.title}`).join('; ');
            if (r.status === 401) fail(`Apple refused the API key (401 ${why}). ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 must all come from the same key under Users and Access → Integrations → App Store Connect API → Team Keys (not Individual Keys), and the key must not be revoked.`);
            if (r.status === 403) fail(`The API key works but is not allowed to do this (403 ${why}). Give the key the Admin role.`);
            if (!r.ok) fail(`App Store Connect answered ${r.status}: ${why}`);
            const app = (j.data || [])[0];
            if (!app) fail('The API key works, but this team has no App Store Connect app with bundle ID com.ezofis.ezofismobile.');
            console.log(`API key OK. App Store Connect app: ${app.attributes.name} (${app.attributes.bundleId}, Apple ID ${app.id}).`);
          })().catch((e) => fail('Could not reach App Store Connect: ' + e.message));
          JS

      - name: Build the web app and sync iOS
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync ios

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded EZOFIS $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$RUNNER_TEMP/App.xcarchive/Info.plist") ($BUILD_NUMBER) to App Store Connect. It appears in TestFlight after Apple's processing (about 10–30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
