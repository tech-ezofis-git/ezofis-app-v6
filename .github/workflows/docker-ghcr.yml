name: Build & Push Docker Images to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'api/**'
      - 'agents/**'
      - 'docker-compose.azure.yml'
      - '.github/workflows/docker-ghcr.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/tech-ezofis-git/ezofis-app-v6/app
  IMAGE_API: ghcr.io/tech-ezofis-git/ezofis-app-v6/api
  IMAGE_AGENTS: ghcr.io/tech-ezofis-git/ezofis-app-v6/agents

jobs:
  build-and-push-app:
    name: Build & Push Front-End (app)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_APP }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short
      - uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          build-args: |
            VITE_BASE_URL=${{ vars.VITE_BASE_URL || 'https://demoapp.ezofis.com' }}
            VITE_V6_BASE_URL=${{ vars.VITE_V6_BASE_URL || '/api' }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY || 'phc_disabled_placeholder' }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID || '154003149422-r47sovs0tdd345o5d8hj8hceq5og53eg.apps.googleusercontent.com' }}
            VITE_MSAL_CLIENT_ID_DEFAULT=${{ vars.VITE_MSAL_CLIENT_ID_DEFAULT || '315d2d09-9633-419e-8e85-18b747eb5be5' }}

  build-and-push-api:
    name: Build & Push Back-End (api)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check_api
        run: |
          if [ -f "./api/Dockerfile" ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
      - if: steps.check_api.outputs.exists == 'true'
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short
      - if: steps.check_api.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

  build-and-push-agents:
    name: Build & Push Agents (FastAPI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check_agents
        run: |
          if [ -f "./agents/Dockerfile" ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
      - if: steps.check_agents.outputs.exists == 'true'
        id: meta-agents
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_AGENTS }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short
      - if: steps.check_agents.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./agents
          file: ./agents/Dockerfile
          push: true
          tags: ${{ steps.meta-agents.outputs.tags }}
          labels: ${{ steps.meta-agents.outputs.labels }}

  restart-webapp:
    name: Restart Azure Web App
    runs-on: ubuntu-latest
    needs: [build-and-push-app, build-and-push-api, build-and-push-agents]
    if: always() && (needs.build-and-push-app.result == 'success' || needs.build-and-push-api.result == 'success' || needs.build-and-push-agents.result == 'success')
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Restart web app to pull new images
        run: |
          az webapp config appsettings set --resource-group rg-v6 --name ezofis-app-v6 --settings HttpsRedirection__Enabled=false Swagger__Enabled=true
          az webapp restart --resource-group rg-v6 --name ezofis-app-v6
