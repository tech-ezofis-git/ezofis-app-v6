name: Build & Push Docker Images to GHCR

# Way 2 (no ACR):
# - Build only services whose paths changed (or selected via workflow_dispatch).
# - Pin only those services to sha-<short> in Azure compose; leave others on current tags.
# - Restart once per changed service, then smoke-check before continuing.
# - Never reset unchanged services to :latest (that forced full-stack GHCR pulls).

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'api/**'
      - 'agents/**'
      - 'docker-compose.azure.yml'
      - '.github/workflows/docker-ghcr.yml'
      - '.github/scripts/deploy-azure-compose.sh'
  workflow_dispatch:
    inputs:
      deploy_app:
        description: Build & deploy front-end (app)
        type: boolean
        default: false
      deploy_api:
        description: Build & deploy API
        type: boolean
        default: false
      deploy_agents:
        description: Build & deploy agents
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/tech-ezofis-git/ezofis-app-v6/app
  IMAGE_API: ghcr.io/tech-ezofis-git/ezofis-app-v6/api
  IMAGE_AGENTS: ghcr.io/tech-ezofis-git/ezofis-app-v6/agents
  AZURE_RESOURCE_GROUP: rg-v6
  AZURE_WEBAPP_NAME: ezofis-app-v6
  SMOKE_BASE_URL: https://cloud.ezofis.com

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.select.outputs.app }}
      api: ${{ steps.select.outputs.api }}
      agents: ${{ steps.select.outputs.agents }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            app:
              - 'app/**'
            api:
              - 'api/**'
            agents:
              - 'agents/**'
      - id: select
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APP="${{ inputs.deploy_app }}"
            API="${{ inputs.deploy_api }}"
            AGENTS="${{ inputs.deploy_agents }}"
          else
            APP="${{ steps.filter.outputs.app }}"
            API="${{ steps.filter.outputs.api }}"
            AGENTS="${{ steps.filter.outputs.agents }}"
            if [ "$APP" != "true" ] && [ "$API" != "true" ] && [ "$AGENTS" != "true" ]; then
              echo "No app/api/agents path changes — skipping builds."
            fi
          fi
          [ "$APP" = "true" ] || APP=false
          [ "$API" = "true" ] || API=false
          [ "$AGENTS" = "true" ] || AGENTS=false
          ANY=false
          if [ "$APP" = "true" ] || [ "$API" = "true" ] || [ "$AGENTS" = "true" ]; then
            ANY=true
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "agents=$AGENTS" >> "$GITHUB_OUTPUT"
          echo "any=$ANY" >> "$GITHUB_OUTPUT"
          echo "Deploy selection: app=$APP api=$API agents=$AGENTS"

  build-and-push-app:
    name: Build & Push Front-End (app)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_APP }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short
      - uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          build-args: |
            VITE_BASE_URL=${{ vars.VITE_BASE_URL || 'https://demoapp.ezofis.com' }}
            VITE_V6_BASE_URL=${{ vars.VITE_V6_BASE_URL || '/api' }}
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY || 'phc_disabled_placeholder' }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID || '154003149422-r47sovs0tdd345o5d8hj8hceq5og53eg.apps.googleusercontent.com' }}
            VITE_MSAL_CLIENT_ID_DEFAULT=${{ vars.VITE_MSAL_CLIENT_ID_DEFAULT || '315d2d09-9633-419e-8e85-18b747eb5be5' }}

  build-and-push-api:
    name: Build & Push Back-End (api)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check_api
        run: |
          if [ -f "./api/Dockerfile" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check_api.outputs.exists == 'true'
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short
      - if: steps.check_api.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

  build-and-push-agents:
    name: Build & Push Agents (FastAPI)
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check_agents
        run: |
          if [ -f "./agents/Dockerfile" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check_agents.outputs.exists == 'true'
        id: meta-agents
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_AGENTS }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short
      - if: steps.check_agents.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./agents
          file: ./agents/Dockerfile
          push: true
          tags: ${{ steps.meta-agents.outputs.tags }}
          labels: ${{ steps.meta-agents.outputs.labels }}

  deploy-azure:
    name: Pin changed services & smoke-check
    runs-on: ubuntu-latest
    needs: [changes, build-and-push-app, build-and-push-api, build-and-push-agents]
    if: |
      always() &&
      needs.changes.outputs.any == 'true' &&
      (
        needs.build-and-push-app.result == 'success' ||
        needs.build-and-push-api.result == 'success' ||
        needs.build-and-push-agents.result == 'success'
      )
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Select Azure subscription
        run: |
          if [ -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          elif [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          fi
          az account show --query "{name:name,id:id}" -o json
      - name: Deploy only rebuilt services (sequential pin + one restart each)
        env:
          DEPLOY_APP: ${{ needs.build-and-push-app.result == 'success' }}
          DEPLOY_API: ${{ needs.build-and-push-api.result == 'success' }}
          DEPLOY_AGENTS: ${{ needs.build-and-push-agents.result == 'success' }}
          IMAGE_APP: ${{ env.IMAGE_APP }}
          IMAGE_API: ${{ env.IMAGE_API }}
          IMAGE_AGENTS: ${{ env.IMAGE_AGENTS }}
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
          SMOKE_BASE_URL: ${{ env.SMOKE_BASE_URL }}
          SMOKE_ATTEMPTS: '20'
          SMOKE_SLEEP_SEC: '60'
        run: |
          chmod +x .github/scripts/deploy-azure-compose.sh
          .github/scripts/deploy-azure-compose.sh
