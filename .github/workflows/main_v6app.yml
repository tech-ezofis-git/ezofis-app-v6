name: Build and deploy React + Vite app to Azure Web App - V6APP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          NODE_ENV=production npm ci

      - name: Build Vite app
        run: npm run build

      - name: Run tests (if test script exists)
        run: |
          if npm run | grep -q "test"; then npm run test; else echo "No test script found, skipping..."; fi

      - name: Zip built artifacts
        run: zip -r release.zip dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F502F44E317C4D99B468F413B525864E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F1A6CBEB2BAD43A0B7D595B7EFB9A702 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_88FFCB7ED3CB447A8E42CBFDF649519C }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'V6APP'
          slot-name: 'Production'
          package: release.zip
