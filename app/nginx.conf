server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Azure App Service multi-container DNS (Docker embedded resolver).
    # Variable proxy_pass defers upstream resolution so nginx can start
    # before sibling containers are registered.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Hangfire posts here; exact match beats `^~ /api/` so it hits agents, not C#.
    location = /api/ezDataImport {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Python agents PDF generator (POST /api/pdf/generate, download/preview/templates).
    location ^~ /api/pdf/ {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Report Agent API — must stay in app/nginx.conf (front-end folder syncs have overwritten this before).
    location ^~ /api/report-agent/ {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/ {
        set $api_upstream api:5000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /swagger {
        set $api_upstream api:5000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /hangfire {
        set $api_upstream api:5000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Cookie $http_cookie;
    }

    location ^~ /console {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
    location ^~ /chat {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
    location ^~ /actions/ {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
    location ^~ /static/ {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /metrics {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /health {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /docs {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location ^~ /redoc {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /openapi.json {
        set $agents_upstream agents:8000;
        proxy_pass http://$agents_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /v5-api/ {
        # Same-origin Classic API so browser CORS does not block cloud.ezofis.com.
        proxy_pass https://eztapi.ezofis.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host eztapi.ezofis.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location ^~ /v5/ {
        # Classic is hosted at trial.ezofis.com root. Strip /v5 so the
        # browser URL stays on cloud while files come from trial /.
        proxy_pass https://trial.ezofis.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host trial.ezofis.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_hide_header X-Frame-Options;
    }

    location = /v5 {
        return 302 /v5/;
    }

    location ^~ /v5app/ {
        proxy_pass https://trial.ezofis.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host trial.ezofis.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_hide_header X-Frame-Options;
    }

    location = /v5app {
        return 302 /v5app/;
    }

    # Classic sidecar apps (PDFViewer, docsviewer, ...) live on trial, not V6.
    location ~* ^/(PDFViewer|pdfviewer|docsviewer|DocsEditor|DocsMerge|v5viewer|EZPORTAL)/ {
        proxy_pass https://trial.ezofis.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host trial.ezofis.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_hide_header X-Frame-Options;
    }

    # Root-path Classic assets (publicPath=/). V6 uses /assets/, so these are safe.
    location ^~ /js/ {
        proxy_pass https://trial.ezofis.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host trial.ezofis.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /css/ {
        proxy_pass https://trial.ezofis.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host trial.ezofis.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /img/ {
        proxy_pass https://trial.ezofis.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host trial.ezofis.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /fonts/ {
        proxy_pass https://trial.ezofis.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host trial.ezofis.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
