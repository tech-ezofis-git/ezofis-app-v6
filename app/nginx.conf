server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to the backend container (multi-container App Service:
    # nginx and the API run as separate containers in the same Docker Compose app,
    # reachable by service name -- see docker-compose.azure.yml). No path rewrite
    # needed since API routes already start with /api (e.g. /api/users, /api/signup).
    # ^~ makes these prefix matches win over the regex static-asset location
    # below, which would otherwise capture .js/.css requests under /api and
    # /swagger and 404 them from the SPA root.
    location ^~ /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the original scheme from the Azure front end (which
        # terminates TLS) instead of $scheme, which is always plain http
        # inside the container and made the API's HTTPS redirection loop.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Swagger UI from the API container (enabled via Swagger__Enabled app setting)
    location ^~ /swagger {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # FastAPI AI Orchestrator (agents container) — console UI + chat/OCR APIs.
    # Routes stay at the FastAPI root paths so the built-in console.html works
    # without a path-prefix rewrite. These prefixes do not collide with the
    # React SPA (which uses /assets and app routes under other names).
    location ^~ /console {
        proxy_pass http://agents:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
    location ^~ /chat {
        proxy_pass http://agents:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
    location ^~ /actions/ {
        proxy_pass http://agents:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
    location ^~ /static/ {
        proxy_pass http://agents:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /metrics {
        proxy_pass http://agents:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
