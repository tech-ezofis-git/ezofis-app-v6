      --orange-3: #ffefd6;

      --font-main: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-head: 'Poppins', 'Inter', system-ui, sans-serif;

      --radius-sm: 5px;
      --radius-xl: 12px;
      --radius-pill: 9999px;
      --border: 1px solid var(--gray-3);
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / .05);
      --shadow-card: 0 1px 3px rgba(0, 0, 0, .05);
      --shadow-card-hover: 0 4px 6px rgba(0, 0, 0, .07);
      --shadow-pill: 0 10px 25px -5px rgba(124, 58, 237, .15);
      --focus-ring: 0 0 0 2px rgba(147, 51, 234, .1);

      /* derived from tokens */
      --line-strong: color-mix(in srgb, var(--gray-8) 45%, #fff);
      --primary-tint: color-mix(in srgb, var(--primary) 8%, #fff);
      --primary-line: color-mix(in srgb, var(--primary) 40%, #fff);
      --cyan-tint: color-mix(in srgb, var(--secondary) 12%, #fff);
      --green-ink: color-mix(in srgb, var(--green-9) 62%, #000);
      --red-ink: color-mix(in srgb, var(--red-9) 78%, #000);
      --orange-ink: color-mix(in srgb, var(--orange-9) 62%, #000);
      --cyan-ink: color-mix(in srgb, var(--secondary) 55%, #000);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      margin: 0;
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 450;
      color: var(--gray-13);
      background: var(--surface);
      -webkit-font-smoothing: antialiased;
      line-height: 1.45
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-align: inherit
    }

    input,
    select {
      font: inherit;
      color: inherit
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    [hidden] {
      display: none !important
    }

    .ic {
      flex: none;
      display: inline-block;
      vertical-align: middle
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    /* ---------- App shell ---------- */
    .app {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      grid-template-rows: 64px minmax(0, 1fr);
      height: 100vh;
      min-height: 0
    }

    .logo-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: var(--border);
      border-bottom: var(--border);
      background: var(--gray-1)
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px 0 16px;
      border-bottom: var(--border);
      background: var(--gray-1)
    }

    .top-title {
      font-family: var(--font-head);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em
    }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .icon-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      color: var(--gray-11)
    }

    .icon-btn:hover {
      background: var(--gray-3);
      color: var(--gray-13)
    }

    .icon-btn .dot {
      position: absolute;
      top: 5px;
      right: 6px;
      min-width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: var(--primary);
      border: 2px solid var(--gray-1);
      box-sizing: content-box
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      background: var(--gray-3);
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 13px;
      color: var(--gray-11);
      margin-left: 6px
    }

    .nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 0 14px;
      border-right: var(--border);
      background: var(--surface)
    }

    .nav .sp {
      flex: 1
    }

    .nav-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      color: var(--gray-11)
    }

    .nav-btn:hover {
      background: var(--gray-3)
    }

    .nav-btn.active {
      background: var(--gray-3);
      color: var(--primary)
    }

    .nav-btn.ai {
      color: var(--primary)
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0
    }

    .subhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 26px;
      border-bottom: var(--border);
      background: var(--surface);
      flex: none
    }

    .subhead .t {
      font-family: var(--font-head);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em
    }

    .subhead .s {
      font-size: 13px;
      color: var(--gray-11);
      margin-top: 1px
    }

    .subhead .r {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .workspace {
      flex: 1;
      display: flex;
      min-height: 0
    }

    .scroll {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 24px 26px 40px;
      background: var(--surface)
    }

    .side {
      width: 410px;
      flex: none;
      border-left: var(--border);
      background: var(--gray-2);
      overflow: auto
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1900px;
      margin: 0 auto
    }

    /* ---------- Controls ---------- */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      font-weight: 500;
      transition: all .2s;
      height: 40px
    }

    .btn-primary:hover {
      background: color-mix(in srgb, var(--primary) 90%, #000)
    }

    .btn-primary:active {
      transform: scale(.98)
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 7px 14px;
      font-weight: 500;
      background: transparent
    }

    .btn-secondary:hover {
      background: var(--primary-tint)
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      background: #fff;
      font-weight: 500;
      font-size: 13px
    }

    .btn-ghost:hover {
      background: var(--gray-2)
    }

    .link {
      color: var(--primary);
      font-weight: 500;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .link:hover {
      text-decoration: underline
    }

    .sel-repo {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 300px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: #fff;
      position: relative
    }

    .sel-repo span.v {
      flex: 1;
      font-weight: 500
    }

    .sel-repo:hover {
      background: var(--gray-2)
    }

    /* dropdown menu (contextual anchor, not an overlay) */
    .menu {
      position: absolute;
      z-index: 40;
      top: calc(100% + 6px);
      left: 0;
      min-width: 220px;
      max-height: 320px;
      overflow: auto;
      background: #fff;
      border: var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card-hover), 0 8px 24px rgba(0, 0, 0, .06);
      padding: 6px
    }

    .menu.right {
      left: auto;
      right: 0
    }

    .menu .opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 13.5px
    }

    .menu .opt:hover {
      background: var(--gray-2)
    }

    .menu .opt.sel {
      background: var(--primary-tint);
      color: var(--primary);
      font-weight: 600
    }

    .menu .hd {
      padding: 6px 10px 4px;
      font-size: 11px;
      color: var(--gray-10);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .menu .field {
      padding: 6px 10px
    }

    .menu label.lb {
      display: block;
      font-size: 11.5px;
      color: var(--gray-11);
      margin-bottom: 4px;
      font-weight: 500
    }

    .menu input[type=text],
    .menu select {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      background: #fff
    }

    .menu input:focus,
    .menu select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: var(--focus-ring)
    }

    .menu-wrap {
      position: relative;
      display: inline-block
    }

    /* ---------- Filter bar ---------- */
    .card {
      background: var(--surface);
      border: var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      transition: box-shadow .2s ease
    }

    .card:hover {
      box-shadow: var(--shadow-card-hover)
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
      align-items: start;
      gap: 14px 24px;
      padding: 14px 18px
    }

    .filter-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0
    }

    .filters>.search {
      width: 100%;
      justify-self: end;
      margin: 0
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-pill);
      background: #fff;
      font-size: 14px;
      white-space: nowrap
    }

    .chip:hover {
      background: var(--gray-2)
    }

    .chip.on {
      background: var(--primary-tint);
      border-color: var(--primary-line);
      color: var(--primary)
    }

    .chip .x {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 9999px
    }

    .chip .x:hover {
      background: rgba(147, 51, 234, .14)
    }

    .chip.plus {
      width: 36px;
      padding: 0;
      justify-content: center
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      width: min(360px, 100%);
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--gray-10)
    }

    .search:focus-within {
      border-color: var(--primary);
      box-shadow: var(--focus-ring)
    }

    .search input {
      border: 0;
      outline: 0;
      flex: 1;
      min-width: 0;
      background: transparent;
      color: var(--gray-13)
    }

    .search input::placeholder {
      color: var(--gray-10)
    }

    /* ---------- Command center ---------- */
    .cc {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 24px;
      flex-wrap: wrap
    }

    .cc h2 {
      font-family: var(--font-head);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em
    }

    .cc .sub {
      font-size: 12.5px;
      color: var(--gray-11);
      margin-top: 2px
    }

    .cc-stats {
      display: flex;
      align-items: center;
      gap: 30px
    }

    .cc-stat {
      text-align: left;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      background: var(--gray-2);
      border: 1px solid var(--gray-3);
      transition: background .12s, border-color .12s
    }

    .cc-stat:hover {
      background: var(--gray-3);
      border-color: var(--line-strong)
    }

    .cc-stat:active {
      background: var(--primary-tint);
      border-color: var(--primary-line)
    }

    .cc-stat.on {
      background: var(--primary-tint);
      border-color: var(--primary-line)
    }

    .cc-stat.on .l {
      color: var(--primary)
    }

    .cc-stat .l {
      font-size: 10.5px;
      letter-spacing: .06em;
      color: var(--gray-11);
      font-weight: 500;
      text-transform: uppercase
    }

    .cc-stat .v {
      font-size: 19px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
      margin-top: 2px
    }

    .cc-stat .v.red {
      color: var(--red-9)
    }

    .cc-toggle {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      color: var(--primary)
    }

    .cc-toggle:hover {
      background: var(--primary-tint)
    }

    .cc-toggle .ic {
      transition: transform .2s
    }

    .cc-toggle[aria-expanded=false] .ic {
      transform: rotate(180deg)
    }

    /* ---------- KPI ---------- */
    .kpis {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 16px
    }

    .kpi {
      display: block;
      width: 100%;
      background: var(--surface);
      border: var(--border);
      border-top: 3px solid var(--c, var(--primary));
      border-radius: var(--radius-xl);
      padding: 16px 20px 16px;
      box-shadow: var(--shadow-card);
      transition: box-shadow .2s, border-color .2s;
      position: relative
    }

    .kpi:hover {
      box-shadow: var(--shadow-card-hover)
    }

    .kpi.active {
      box-shadow: 0 0 0 2px var(--primary-line);
      border-color: var(--primary-line);
      border-top-color: var(--c, var(--primary))
    }

    .kpi .lbl {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .02em;
      text-transform: uppercase;
      color: var(--gray-13)
    }

    .kpi .val {
      font-size: 24px;
      font-weight: 700;
      margin: 8px 0 10px;
      line-height: 1.15;
      letter-spacing: -.01em
    }

    .kpi .foot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--gray-11);
      min-height: 22px
    }

    .delta {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      background: var(--gray-3);
      color: var(--gray-11)
    }

    .delta.bad {
      background: var(--red-3);
      color: var(--red-ink)
    }

    .delta.good {
      background: var(--green-3);
      color: var(--green-ink)
    }

    .kpis.compact .kpi {
      padding: 12px 16px 12px
    }

    .kpis.compact .kpi .lbl {
      font-size: 11.5px
    }

    .kpis.compact .kpi .val {
      font-size: 20px;
      margin: 5px 0 4px
    }

    .kpis.compact .kpi .foot {
      min-height: 0
    }

    .kpi-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    /* ---------- Card layout ---------- */
    .grid {
      display: grid;
      gap: 16px
    }

    .g-2-1 {
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr)
    }

    .g-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .g-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .g-21 {
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr)
    }

    .card-h {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px 0
    }

    .card-h h3 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.005em
    }

    .card-h .sub {
      font-size: 12px;
      color: var(--gray-10);
      margin-top: 2px
    }

    .card-b {
      padding: 14px 22px 20px
    }

    .tabs {
      display: inline-flex;
      background: var(--gray-3);
      border-radius: var(--radius-sm);
      padding: 2px;
      gap: 2px
    }

    .tabs button {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--gray-11)
    }

    .tabs button.on {
      background: #fff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      font-weight: 600
    }

    .note {
      font-size: 12px;
      color: var(--gray-11);
      line-height: 1.5
    }

    .empty {
      padding: 26px 10px;
      text-align: center;
      color: var(--gray-10);
      font-size: 13px
    }

    /* health */
    .health-score {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 2px 0 6px
    }

    .health-score .n {
      font-family: var(--font-head);
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1
    }

    .health-score .d {
      font-size: 16px;
      color: var(--gray-10);
      font-weight: 500
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600
    }

    .status-badge.green {
      background: var(--green-3);
      color: var(--green-ink)
    }

    .status-badge.orange {
      background: var(--orange-3);
      color: var(--orange-ink)
    }

    .status-badge.red {
      background: var(--red-3);
      color: var(--red-ink)
    }

    .segbar {
      display: flex;
      height: 10px;
      border-radius: 9999px;
      overflow: hidden;
      background: var(--gray-3);
      gap: 2px;
      margin: 16px 0 14px
    }

    .segbar i {
      display: block;
      height: 100%;
      min-width: 3px
    }

    .trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .trio button {
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      text-align: left
    }

    .trio button:hover {
      background: var(--gray-2)
    }

    .trio .l {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--gray-11);
      font-weight: 500
    }

    .trio .l i {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      display: inline-block
    }

    .trio .v {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px
    }

    details.how {
      margin-top: 12px;
      border-top: var(--border);
      padding-top: 10px
    }

    details.how summary {
      cursor: pointer;
      color: var(--primary);
      font-weight: 500;
      font-size: 13px;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px
    }

    details.how summary::-webkit-details-marker {
      display: none
    }

    details.how[open] summary .ic {
      transform: rotate(90deg)
    }

    .hc {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px
    }

    .hc th {
      font-weight: 500;
      color: var(--gray-10);
      text-align: left;
      padding: 4px 0;
      border-bottom: var(--border)
    }

    .hc td {
      padding: 4px 0;
      border-bottom: var(--border)
    }

    .hc td:not(:first-child),
    .hc th:not(:first-child) {
      text-align: right
    }

    /* bars */
    .hbar {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr) 54px;
      align-items: center;
      gap: 12px;
      height: 38px;
      width: 100%;
      border-radius: var(--radius-sm);
      padding: 0 6px;
      margin: 0 -6px;
      width: calc(100% + 12px)
    }

    .hbar:hover {
      background: var(--gray-2)
    }

    .hbar.on {
      background: var(--primary-tint)
    }

    .hbar .lb {
      font-size: 13px;
      color: var(--gray-11);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .hbar .tr {
      height: 14px;
      background: var(--gray-3);
      border-radius: var(--radius-sm);
      overflow: hidden
    }

    .hbar .fl {
      display: block;
      height: 100%;
      border-radius: var(--radius-sm);
      min-width: 2px;
      transition: width .35s ease
    }

    .hbar .nv {
      text-align: right;
      font-weight: 700;
      font-size: 14px
    }

    .hbar.sm {
      height: 32px
    }

    .legend-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--gray-11);
      margin-top: 8px
    }

    .legend-row i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -1px
    }

    /* workflow */
    .flow {
      display: flex;
      align-items: stretch;
      gap: 0;
      overflow: auto;
      padding: 4px 0
    }

    .stage {
      flex: 1;
      min-width: 130px;
      text-align: left;
      border: 1px solid var(--gray-3);
      border-radius: var(--radius-xl);
      padding: 12px 16px;
      background: #fff;
      position: relative;
      transition: box-shadow .2s
    }

    .stage:hover {
      box-shadow: var(--shadow-card-hover)
    }

    .stage.on {
      border-color: var(--primary-line);
      box-shadow: 0 0 0 2px var(--primary-tint)
    }

    .stage .l {
      font-size: 12.5px;
      color: var(--gray-11);
      font-weight: 600
    }

    .stage .v {
      font-size: 24px;
      font-weight: 700;
      margin-top: 2px;
      letter-spacing: -.01em
    }

    .stage .m {
      font-size: 11.5px;
      color: var(--gray-10);
      margin-top: 2px
    }

    .stage .bar {
      height: 4px;
      border-radius: 9999px;
      background: var(--gray-3);
      margin-top: 8px;
      overflow: hidden
    }

    .stage .bar i {
      display: block;
      height: 100%;
      background: var(--primary);
      border-radius: 9999px
    }

    .arrow {
      display: grid;
      place-items: center;
      width: 34px;
      flex: none;
      color: var(--gray-8)
    }

    .stage.od {
      border-color: color-mix(in srgb, var(--red-9) 35%, #fff);
      background: color-mix(in srgb, var(--red-9) 4%, #fff);
      margin-left: 10px;
      max-width: 190px
    }

    .stage.od .v {
      color: var(--red-9)
    }

    .wf-types {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px
    }

    .wf-types button {
      padding: 3px 10px;
      border-radius: 9999px;
      border: 1px solid var(--line-strong);
      font-size: 12px;
      color: var(--gray-11);
      background: #fff
    }

    .wf-types button:hover {
      border-color: var(--primary-line);
      color: var(--primary)
    }

    .wf-types button.on {
      background: var(--primary-tint);
      border-color: var(--primary-line);
      color: var(--primary);
      font-weight: 600
    }

    /* donut */
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 22px
    }

    .donut {
      flex: none;
      position: relative;
      width: 150px;
      height: 150px
    }

    .donut svg {
      transform: rotate(-90deg)
    }

    .donut .ctr {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center
    }

    .donut .ctr b {
      display: block;
      font-size: 24px;
      letter-spacing: -.01em;
      line-height: 1.1
    }

    .donut .ctr span {
      font-size: 11px;
      color: var(--gray-10)
    }

    .dl {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .dl button {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      width: 100%
    }

    .dl button:hover {
      background: var(--gray-2)
    }

    .dl button.on {
      background: var(--primary-tint)
    }

    .dl i {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      flex: none
    }

    .dl .n {
      flex: 1;
      color: var(--gray-11);
      font-weight: 500
    }

    .dl .p {
      font-weight: 700
    }

    .dl .c {
      font-size: 11.5px;
      color: var(--gray-10);
      width: 48px;
      text-align: right
    }

    .insight-line {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--gray-2);
      font-size: 12.5px;
      color: var(--gray-11);
      line-height: 1.5
    }

    .insight-line .ic {
      color: var(--primary);
      margin-top: 2px
    }

    .insight-line b {
      color: var(--gray-13)
    }

    /* stat tiles */
    .tiles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px
    }

    .tile {
      padding: 10px 12px;
      border: 1px solid var(--gray-3);
      border-left: 3px solid var(--c, var(--primary));
      border-radius: var(--radius-sm);
      background: #fff;
      text-align: left;
      width: 100%
    }

    .tile:hover {
      background: var(--gray-2)
    }

    .tile.on {
      background: var(--primary-tint)
    }

    .tile .l {
      font-size: 11.5px;
      color: var(--gray-11);
      font-weight: 500
    }

    .tile .v {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.01em;
      line-height: 1.2
    }

    .subhd {
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-11);
      margin: 14px 0 4px
    }

    .stat3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px
    }

    .stat3 .tile {
      border-left-width: 1px;
      border-top: 3px solid var(--c)
    }

    /* progress */
    .prog {
      height: 8px;
      border-radius: 9999px;
      background: var(--gray-3);
      overflow: hidden;
      margin: 6px 0 4px
    }

    .prog i {
      display: block;
      height: 100%;
      border-radius: 9999px;
      background: var(--green-9)
    }

    /* ---------- Tables ---------- */
    .tbl-wrap {
      overflow: auto;
      border: var(--border);
      border-radius: var(--radius-xl);
      background: #fff
    }

    table.tbl {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13.5px
    }

    .tbl thead th {
      position: sticky;
      top: 0;
      background: var(--gray-2);
      text-align: left;
      font-weight: 500;
      color: var(--gray-11);
      padding: 11px 14px;
      border-bottom: 1px solid var(--gray-3);
      white-space: nowrap;
      font-size: 13px
    }

    .tbl thead th button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: space-between;
      width: 100%;
      font-weight: 500
    }

    .tbl thead th button .ic {
      color: var(--gray-8)
    }

    .tbl thead th.sorted button .ic {
      color: var(--primary)
    }

    .tbl tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--gray-3);
      white-space: nowrap;
      vertical-align: middle
    }

    .tbl tbody tr:last-child td {
      border-bottom: 0
    }

    .tbl tbody tr.row:hover td {
      background: var(--gray-2);
      cursor: pointer
    }

    .tbl tbody tr.sel td {
      background: var(--primary-tint)
    }

    .tbl td.num,
    .tbl th.num {
      text-align: right
    }

    .tbl td.dim {
      color: var(--gray-8)
    }

    .tbl .nm {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      max-width: 260px
    }

    .tbl .nm span {
      overflow: hidden;
      text-overflow: ellipsis
    }

    .tbl .nm .ic {
      color: var(--primary)
    }

    .tbl .ell {
      width: 44px;
      text-align: center
    }

    .tbl .sub2 {
      display: block;
      font-size: 11.5px;
      color: var(--gray-10);
      font-weight: 450
    }

    .link-cell {
      color: var(--gray-13);
      font-weight: 500;
      text-align: left
    }

    .link-cell:hover {
      color: var(--primary);
      text-decoration: underline
    }

    .tbl tfoot td {
      padding: 10px 14px;
      font-weight: 700;
      background: var(--gray-2);
      border-top: 1px solid var(--gray-3)
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .03em;
      text-transform: uppercase;
      white-space: nowrap
    }

    .badge.green {
      background: var(--green-3);
      color: var(--green-ink)
    }

    .badge.red {
      background: var(--red-3);
      color: var(--red-ink)
    }

    .badge.orange {
      background: var(--orange-3);
      color: var(--orange-ink)
    }

    .badge.purple {
      background: var(--primary-tint);
      color: var(--primary)
    }

    .badge.cyan {
      background: var(--cyan-tint);
      color: var(--cyan-ink)
    }

    .badge.gray {
      background: var(--gray-3);
      color: var(--gray-11)
    }

    .bd {
      display: inline-flex;
      min-width: 44px;
      justify-content: center;
      padding: 2px 9px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums
    }

    .bd.green {
      background: var(--green-3);
      color: var(--green-ink)
    }

    .bd.amber {
      background: var(--orange-3);
      color: var(--orange-ink)
    }

    .bd.orange {
      background: var(--orange-9);
      color: #fff
    }

    .bd.red {
      background: var(--red-9);
      color: #fff
    }

    .bd.none {
      background: transparent;
      color: var(--gray-8)
    }

    .comp {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end
    }

    .comp .prog {
      width: 60px;
      margin: 0
    }

    .tbl-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 0 12px
    }

    .tbl-tools .grow {
      flex: 1
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 4px 0;
      font-size: 13px;
      color: var(--gray-11);
      flex-wrap: wrap
    }

    .pager .pg {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .pager button.pb {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong);
      display: inline-grid;
      place-items: center;
      background: #fff;
      font-size: 13px
    }

    .pager button.pb:hover:not(:disabled) {
      background: var(--gray-2)
    }

    .pager button.pb:disabled {
      opacity: .4;
      cursor: default
    }

    .pager button.pb.on {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary)
    }

    .pager select {
      height: 32px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 0 6px;
      background: #fff
    }

    .legend-bd {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11.5px;
      color: var(--gray-11);
      align-items: center
    }

    .drill-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-tint);
      border: 1px solid var(--primary-line);
      color: var(--primary);
      border-radius: var(--radius-pill);
      padding: 2px 4px 2px 12px;
      font-weight: 600;
      font-size: 12.5px
    }

    .drill-chip .x {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 9999px
    }

    .drill-chip .x:hover {
      background: rgba(147, 51, 234, .14)
    }

    .seg-tabs {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .seg-tabs button {
      padding: 4px 12px;
      border-radius: 9999px;
      border: 1px solid var(--line-strong);
      font-size: 12.5px;
      color: var(--gray-11);
      background: #fff
    }

    .seg-tabs button:hover {
      border-color: var(--primary-line);
      color: var(--primary)
    }

    .seg-tabs button.on {
      background: var(--primary-tint);
      border-color: var(--primary-line);
      color: var(--primary);
      font-weight: 600
    }

    /* ---------- AI insights ---------- */
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid color-mix(in srgb, var(--orange-9) 35%, #fff);
      background: color-mix(in srgb, var(--orange-9) 6%, #fff);
      color: var(--orange-ink);
      border-radius: var(--radius-pill);
      padding: 2px 12px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .02em
    }

    .live i {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: var(--orange-9);
      animation: pulse 1.8s ease-in-out infinite
    }

    @keyframes pulse {
      50% {
        opacity: .35
      }
    }

    .src-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      background: var(--primary-tint);
      color: var(--primary);
      font-size: 11.5px;
      font-weight: 600
    }

    mark {
      background: rgba(245, 158, 11, 0.2);
      color: inherit;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
    }

    .insights {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .insights li {
      border-bottom: 1px dashed var(--gray-3)
    }

    .insights li:last-child {
      border-bottom: 0
    }

    .insights button {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
      padding: 11px 6px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.5
    }

    .insights button:hover {
      background: var(--gray-2)
    }

    .insights .bul {
      flex: none;
      width: 18px;
      height: 18px;
      margin-top: 2px;
      border-radius: 9999px;
      border: 2px solid var(--c);
      display: grid;
      place-items: center
    }

    .insights .bul i {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: var(--c)
    }

    .insights .k {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--gray-11);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 1px
    }

    .ai-block {
      border: 1px solid var(--primary-line);
      background: var(--primary-tint);
      border-radius: var(--radius-xl);
      padding: 12px 14px;
      margin-bottom: 12px
    }

    .ai-block .hd {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 6px
    }

    .ai-item {
      padding: 8px 0;
      border-top: 1px solid rgba(147, 51, 234, .14);
      font-size: 13.5px
    }

    .ai-item:first-of-type {
      border-top: 0
    }

    .ai-item .t {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .ai-item .a {
      color: var(--gray-11);
      margin-top: 2px;
      font-size: 13px
    }

    .ai-item .a b {
      color: var(--gray-13)
    }

    /* actions & notifications */
    .rows {
      display: flex;
      flex-direction: column
    }

    .arow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: var(--border);
      width: 100%
    }

    .arow:last-child {
      border-bottom: 0
    }

    .arow:hover {
      background: var(--gray-2)
    }

    .arow .ico {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      background: var(--c-bg, var(--primary-tint));
      color: var(--c-fg, var(--primary))
    }

    .arow .tx {
      flex: 1;
      min-width: 0
    }

    .arow .tt {
      font-weight: 600;
      font-size: 14px
    }

    .arow .ss {
      font-size: 12px;
      color: var(--gray-10);
      margin-top: 1px
    }

    .arow .go {
      color: var(--gray-8)
    }

    .foot-note {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--gray-2);
      font-size: 12px;
      color: var(--gray-11)
    }

    .foot-note .ic {
      color: var(--primary);
      margin-top: 1px
    }

    /* workload */
    .wl-tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px
    }

    .wl-tile {
      border: 1px solid var(--gray-3);
      border-radius: var(--radius-sm);
      padding: 10px 12px
    }

    .wl-tile h4 {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--gray-11);
      font-weight: 600
    }

    .wl-tile div {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      padding: 1px 0
    }

    .wl-tile b {
      font-weight: 700
    }

    .est {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--gray-3);
      color: var(--gray-11);
      margin-left: 4px
    }

    .chart-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--gray-11);
      margin-top: 6px
    }

    .chart-legend i {
      display: inline-block;
      width: 18px;
      height: 0;
      border-top: 3px solid var(--c);
      margin-right: 6px;
      vertical-align: 3px
    }

    .chart-legend i.dash {
      border-top-style: dashed
    }

    svg.chart text {
      font-family: var(--font-main);
      font-size: 11px;
      fill: var(--gray-10)
    }

    /* ---------- Side panel ---------- */
    .side-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 18px 10px;
      position: sticky;
      top: 0;
      background: var(--gray-2);
      z-index: 2
    }

    .side-h h3 {
      font-size: 15px;
      font-weight: 700
    }

    .side-h .sub {
      font-size: 12px;
      color: var(--gray-10);
      margin-top: 1px;
      word-break: break-all
    }

    .side-b {
      padding: 4px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .pcard {
      background: #fff;
      border: var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      overflow: hidden
    }

    .pcard>h4 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      border-bottom: var(--border);
      color: var(--gray-13)
    }

    .pcard>h4 .ic {
      color: #2563eb
    }

    .kv {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 11px 16px;
      border-bottom: var(--border);
      font-size: 13.5px
    }

    .kv:last-child {
      border-bottom: 0
    }

    .kv .k {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gray-11)
    }

    .kv .k .x {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--green-3);
      color: var(--green-9);
      display: grid;
      place-items: center;
      flex: none
    }

    .kv .k .x.none {
      background: transparent
    }

    .kv .v {
      font-weight: 700;
      text-align: right;
      max-width: 58%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .kv .v.wrap {
      white-space: normal
    }

    .ai-analysis {
      padding: 14px 16px
    }

    .risk-pill {
      display: inline-flex;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700
    }

    .risk-pill.Low {
      background: var(--green-3);
      color: var(--green-ink)
    }

    .risk-pill.Medium {
      background: var(--orange-3);
      color: var(--orange-ink)
    }

    .risk-pill.High {
      background: var(--red-3);
      color: var(--red-ink)
    }

    .ai-analysis .lab {
      font-size: 11.5px;
      color: var(--gray-10);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin: 12px 0 3px
    }

    .ai-analysis p {
      font-size: 13.5px;
      line-height: 1.5
    }

    .ptabs {
      display: flex;
      gap: 6px;
      padding: 0
    }

    .ptabs button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: var(--radius-xl);
      color: var(--gray-11);
      font-weight: 500;
      font-size: 13.5px;
      border: 2px solid transparent
    }

    .ptabs button.on {
      border-color: var(--gray-13);
      color: var(--gray-13);
      background: #fff
    }

    .tl {
      padding: 16px 16px 6px
    }

    .tl-i {
      display: flex;
      gap: 14px;
      position: relative;
      padding-bottom: 18px
    }

    .tl-i:not(:last-child)::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 2px;
      background: var(--gray-3)
    }

    .tl-i .dot {
      flex: none;
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      background: var(--cyan-tint);
      color: #2563eb;
      display: grid;
      place-items: center
    }

    .tl-i .tt {
      font-weight: 600;
      font-size: 13.5px;
      line-height: 1.35
    }

    .tl-i .tt span {
      font-weight: 450;
      color: var(--gray-11)
    }

    .tl-i .ss {
      font-size: 12px;
      color: var(--gray-10);
      margin-top: 2px
    }

    .rel {
      display: flex;
      flex-direction: column
    }

    .rel button {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: var(--border);
      width: 100%;
      font-size: 13.5px
    }

    .rel button:hover {
      background: var(--gray-2)
    }

    .rel button:last-child {
      border-bottom: 0
    }

    .n-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 16px;
      background: #fff;
      border: var(--border);
      border-left: 3px solid var(--c);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      text-align: left;
      width: 100%;
      position: relative
    }

    .n-item:hover {
      box-shadow: var(--shadow-card-hover)
    }

    .n-item.read {
      opacity: .62
    }

    .n-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .n-cat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--c-ink)
    }

    .n-time {
      font-size: 11.5px;
      color: var(--gray-10)
    }

    .n-item .tt {
      font-weight: 700;
      font-size: 14px
    }

    .n-item .ds {
      font-size: 13px;
      color: var(--gray-11)
    }

    .n-item .ac {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }

    .prio {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-10)
    }

    .n-group {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--gray-10);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin: 4px 2px -4px
    }

    .tone-red {
      --c: var(--red-9);
      --c-ink: var(--red-ink)
    }

    .tone-orange {
      --c: var(--orange-9);
      --c-ink: var(--orange-ink)
    }

    .tone-purple {
      --c: var(--primary);
      --c-ink: var(--primary)
    }

    .tone-cyan {
      --c: var(--secondary);
      --c-ink: var(--cyan-ink)
    }

    .tone-green {
      --c: var(--green-9);
      --c-ink: var(--green-ink)
    }

    pre.json {
      margin: 0;
      background: var(--gray-2);
      border: var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 11.5px;
      max-height: 190px;
      overflow: auto;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word
    }

    .ai-set label.lb {
      display: block;
      font-size: 12px;
      color: var(--gray-11);
      font-weight: 500;
      margin: 10px 0 4px
    }

    .ai-set input[type=text],
    .ai-set select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      background: #fff
    }

    .ai-set input:focus,
    .ai-set select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: var(--focus-ring)
    }

    .ai-set .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px
    }

    .ai-set .st {
      font-size: 12.5px;
      color: var(--gray-11);
      margin-top: 8px
    }

    .sw {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 13.5px
    }

    .sw input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary)
    }

    /* report */
    .rep-title {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .rep-title .back {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      color: var(--gray-11)
    }

    .rep-title .back:hover {
      background: var(--gray-3)
    }

    .rep-title h2 {
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font-head);
      letter-spacing: -.01em
    }

    .rep-title .where {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gray-10);
      font-size: 13px
    }

    /* misc */
    .tip {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      background: var(--gray-13);
      color: #fff;
      font-size: 12px;
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      max-width: 280px;
      opacity: 0;
      transition: opacity .12s;
      line-height: 1.4
    }

    .tip.on {
      opacity: 1
    }

    .toast {
      position: fixed;
      z-index: 110;
      right: 22px;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--gray-13);
      color: #fff;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      box-shadow: var(--shadow-card-hover);
      opacity: 0;
      transform: translateY(8px);
      transition: all .2s;
      pointer-events: none
    }

    .toast.on {
      opacity: 1;
      transform: none
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--primary-line);
      border-top-color: var(--primary);
      border-radius: 9999px;
      animation: spin .8s linear infinite;
      vertical-align: -2px
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .attn-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    /* ---------- Responsive ---------- */
    @media (max-width:1500px) {
      .kpis {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }

      .g-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    /* ---------- Tablet (portrait and landscape): docked overlay panel, nav stays full size ---------- */
    @media (max-width:1180px) {

      .g-2-1,
      .g-21,
      .g-2 {
        grid-template-columns: minmax(0, 1fr)
      }

      .side {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: min(92vw, 410px);
        z-index: 30;
        box-shadow: -10px 0 26px rgba(0, 0, 0, .09)
      }

      .workspace {
        position: relative
      }
    }

    @media (max-width:1024px) {
      .kpis {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .g-3 {
        grid-template-columns: minmax(0, 1fr)
      }

      .cc-stats {
        gap: 20px;
        flex-wrap: wrap;
        row-gap: 10px
      }
    }

    @media (max-width:900px) {
      .subhead {
        flex-direction: column;
        align-items: stretch;
        gap: 12px
      }

      .sel-repo {
        width: 100%
      }

      .wl-tiles {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .donut-wrap {
        flex-direction: column;
        align-items: flex-start
      }
    }

    /* ---------- Phone only: compact nav rail and full-width docked panel ---------- */
    @media (max-width:640px) {
      .scroll {
        padding: 16px 14px 30px
      }

      .app {
        grid-template-columns: 52px minmax(0, 1fr)
      }

      .wl-tiles {
        grid-template-columns: minmax(0, 1fr)
      }

      .side {
        width: 100%;
        box-shadow: none
      }
    }

    @media (max-width:480px) {
      .kpis {
        grid-template-columns: minmax(0, 1fr)
      }

      .cc-stats {
        gap: 14px
      }

      .top-title {
        font-size: 14px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important
      }
    }

    /* ---------- Center-only dashboard with four full-width sections ---------- */
    .app.center-only {
      display: block;
      height: 100vh;
      min-height: 0
    }

    .center-only>.logo-cell,
    .center-only>.topbar,
    .center-only>.nav,
    .center-only .subhead {
      display: none !important
    }

    .center-only .main {
      height: 100vh;
      min-height: 0
    }

    .center-only .workspace {
      height: 100%;
      min-height: 0
    }

    .center-only .scroll {
      padding: 24px 26px 40px
    }

    .dash-section {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .section-content {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .section-heading {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 24px;
      text-align: left;
      cursor: pointer;
      color: var(--gray-13)
    }

    button.section-heading {
      font: inherit;
      background: var(--surface)
    }

    .section-heading:hover {
      box-shadow: var(--shadow-card-hover)
    }

    .section-heading:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring), var(--shadow-card-hover)
    }

    .section-heading .section-title {
      min-width: 0
    }

    .section-heading h2 {
      margin: 0;
      font-family: var(--font-head);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.01em
    }

    .section-heading .sub {
      font-size: 12.5px;
      color: var(--gray-11);
      margin-top: 2px
    }

    .section-heading .section-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--gray-10);
      font-size: 12px;
      white-space: nowrap
    }

    .section-chevron {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      color: var(--primary);
      flex: none;
      transition: transform .2s ease, background .12s ease
    }

    .section-heading:hover .section-chevron {
      background: var(--primary-tint)
    }

    .section-heading[aria-expanded=false] .section-chevron {
      transform: rotate(180deg)
    }

    .command-heading .cc-stats {
      margin-left: auto
    }

    .command-heading .cc-stat {
      cursor: pointer
    }

    .report-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap
    }

    @media (max-width:900px) {
      .center-only .scroll {
        padding: 18px 16px 30px
      }

      .section-heading {
        align-items: flex-start;
        padding: 16px 18px
      }

      .section-heading .section-meta {
        display: none
      }

      .command-heading .cc-stats {
        width: 100%;
        margin-left: 0
      }
    }

    @media (max-width:1180px) {
      .filters {
        grid-template-columns: minmax(0, 1fr)
      }

      .filters>.search {
        width: min(420px, 100%);
        justify-self: end
      }
    }

    @media (max-width:640px) {
      .center-only .scroll {
        padding: 14px 12px 26px
      }

      .section-heading {
        padding: 15px 16px
      }

      .filters {
        padding: 12px;
        gap: 12px
      }

      .filters>.search {
        width: 100%;
        justify-self: stretch
      }
    }
  </style>
</head>

    function allocate(n, weights) {           // largest-remainder allocation so folder counts are exact
      const tot = weights.reduce((s, w) => s + w, 0);
      const raw = weights.map(w => n * w / tot), base = raw.map(Math.floor);
      let left = n - base.reduce((s, v) => s + v, 0);
      raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left-- > 0) base[i]++; });
      return base;
    }

    const EXC_TYPES = ['Missing Metadata', 'Expired Document', 'Verification Failed', 'Signature Missing', 'Incorrect Document Type', 'Duplicate', 'Missing Mandatory Document', 'Version Conflict', 'KYC Mismatch'];
    const STAGES = ['uploaded', 'submitted', 'verification', 'approval', 'signature', 'completed'];
    const STAGE_LABEL = { uploaded: 'Uploaded', submitted: 'Submitted', verification: 'Verification', approval: 'Approval', signature: 'Signature', completed: 'Completed' };
    const WF_NAMES = ['Document Verification', 'KYC Review', 'Agreement Approval', 'Contract Renewal', 'Document Sign-Off', 'Customer Document Update', 'Retention Review'];

    function generateDemoDocuments() {
      const docs = [];
      let seq = 0;
      const customers = {};                       // per-folder customer pools
      const newCorp = () => `${pick(CORP_A)} ${pick(CORP_B)} ${pick(CORP_C)}`;
      const newPerson = () => `${pick(P_FIRST)} ${pick(P_LAST)}`;
      const newAcct = () => `ACC-${ri(100000, 999999)}`;

      Object.entries(FOLDERS).forEach(([folder, f]) => {
        const typeCounts = f.forms ? allocate(f.n - f.forms, f.types.map(t => t[1])) : allocate(f.n, f.types.map(t => t[1]));
        const list = [];
        if (f.forms) for (let i = 0; i < f.forms; i++) list.push('KYC Form');
        f.types.forEach((t, i) => { for (let k = 0; k < typeCounts[i]; k++) list.push(t[0]); });
        shuffle(list);
        // customers: KYC folders get one customer per KYC form, others a pool of roughly n/4
        const poolSize = f.forms || Math.round(f.n / 4);
        const pool = [];
        for (let i = 0; i < poolSize; i++) {
          const isPerson = f.cust === 'person' || (f.cust === 'mix' && RNG() < .5);
          pool.push({ name: isPerson ? newPerson() : newCorp(), acct: newAcct(), person: isPerson });
        }
        customers[folder] = pool;
        let formIdx = 0;
        list.forEach(type => {
          const t = TYPES[type];
          const c = type === 'KYC Form' ? pool[formIdx++] : pick(pool);
          const id = ++seq;
          docs.push({
            id, uid: `DOC-${String(id).padStart(6, '0')}`,
            type, cat: t[0], validity: t[1], retY: t[2], caps: t[3], isForm: type === 'KYC Form',
            folder, repo: f.repo, sub: pick(f.subs),
            dept: RNG() < .85 ? f.dept : pick(DEPTS),
            customer: c.name, account: c.acct,
            owner: pick(STAFF),
            version: `v${ri(1, 4)}.0`, newVersion: false,
            archived: false, hold: false,
            expiry: null, retention: null, issue: null, kycReview: null,
            approval: 'na', verification: 'na', signature: 'na', kyc: 'na',
            wf: null, exc: null
          });
        });
      });

      docs.forEach(d => {
        const short = d.customer.split(' ').slice(0, 2).join('-').replace(/[^A-Za-z0-9-]/g, '');
        d.name = `${d.type.replace(/[ /]+/g, '_')}_${short}_${String(d.id).padStart(5, '0')}.pdf`;
        d.docNo = `${d.type.split(' ').map(w => w[0]).join('').replace(/[^A-Z]/g, '').slice(0, 3).padEnd(2, 'X')}-${TODAY.getFullYear()}-${String(ri(1, 999999)).padStart(6, '0')}`;
      });

      /* ---- archived (5%) : no expiry, retention long past ---- */
      const archPool = shuffle(docs.filter(d => !d.isForm && !d.validity));
      archPool.slice(0, 620).forEach(d => {
        d.archived = true;
        d.retention = addDays(TODAY, -ri(30, 900));
        d.issue = addDays(d.retention, -Math.round(d.retY * 365));
      });
      const live = docs.filter(d => !d.archived);

      /* ---- expiry buckets (exact quotas) ---- */
      const expPool = shuffle(live.filter(d => d.validity));
      const EXPQ = [['expired', 84], ['e7', 28], ['e30', 114], ['e60', 176], ['e90', 245]];
      let ek = 0;
      expPool.forEach((d, i) => {
        const vDays = Math.max(120, Math.round((d.validity[0] + RNG() * (d.validity[1] - d.validity[0])) * 365));
        let off;
        let acc = 0, bucket = 'rest';
        for (const [k, n] of EXPQ) { acc += n; if (i < acc) { bucket = k; break; } }
        if (bucket === 'expired') off = -ri(1, 120);
        else if (bucket === 'e7') off = ri(0, 7);
        else if (bucket === 'e30') off = ri(8, 30);
        else if (bucket === 'e60') off = ri(31, 60);
        else if (bucket === 'e90') off = ri(61, 90);
        else off = ri(91, Math.max(95, vDays));
        d.expiry = addDays(TODAY, off);
        d.issue = addDays(d.expiry, -Math.max(vDays, off < 0 ? 200 : 0));
        d.retention = addDays(d.expiry, Math.round(d.retY * 365));
      });

      /* ---- retention buckets (exact quotas) on non-expiring documents ---- */
      const retPool = shuffle(live.filter(d => !d.validity));
      const RETQ = [['reached', 78], ['r30', 50], ['r60', 38], ['r90', 52]];
      retPool.forEach((d, i) => {
        let acc = 0, bucket = 'rest';
        for (const [k, n] of RETQ) { acc += n; if (i < acc) { bucket = k; break; } }
        const full = Math.round(d.retY * 365);
        let off;
        if (bucket === 'reached') off = -ri(0, 400);
        else if (bucket === 'r30') off = ri(1, 30);
        else if (bucket === 'r60') off = ri(31, 60);
        else if (bucket === 'r90') off = ri(61, 90);
        else off = ri(91, full - 30);
        d.retention = addDays(TODAY, off);
        d.issue = addDays(d.retention, -full);
      });
      retPool.slice(0, 12).forEach(d => d.hold = true);                       // legal hold on 12 retention-reached documents
      shuffle(live.filter(d => !d.hold)).slice(0, 28).forEach(d => d.hold = true);

      /* ---- new versions ---- */
      const newVer = shuffle(live.slice()).slice(0, 52);
      newVer.forEach(d => { d.newVersion = true; d.version = `v${parseInt(d.version[1]) + 1}.0`; });

      /* ---- KYC anchors (1,424 KYC forms) ---- */
      const forms = shuffle(live.filter(d => d.isForm));
      const KYCQ = [['verified', 1246], ['review_due', 82], ['pending', 47], ['expired', 19], ['failed', 6], ['missing', 24]];
      let fi = 0;
      KYCQ.forEach(([k, n]) => { for (let i = 0; i < n && fi < forms.length; i++, fi++) { const d = forms[fi]; d.kyc = k; d.kycStatusSet = true; } });
      forms.forEach(d => {
        if (d.kyc === 'verified') d.kycReview = addDays(TODAY, ri(31, 360));
        else if (d.kyc === 'review_due') d.kycReview = addDays(TODAY, ri(1, 30));
        else if (d.kyc === 'expired') d.kycReview = addDays(TODAY, -ri(1, 120));
      });

      /* ---- approval / verification / signature status (exclusive in-flight groups) ---- */
      const used = new Set();
      const take = (pool, n) => { const out = []; for (const d of pool) { if (out.length >= n) break; if (!used.has(d)) { used.add(d); out.push(d); } } return out; };
      const vPool = shuffle(live.filter(d => d.caps.includes('v') && !d.isForm));
      const aPool = shuffle(live.filter(d => d.caps.includes('a') && !d.isForm));
      const sPool = shuffle(live.filter(d => d.caps.includes('s') && !d.isForm));
      const G = {
        verPending: take(vPool, 41), verFailed: take(vPool, 9), verNotStarted: take(vPool, 23),
        appPending: take(aPool, 63), appRejected: take(aPool, 16), appNotSub: take(aPool, 36),
        sigPending: take(sPool, 23), sigPartial: take(sPool, 8), sigRejected: take(sPool, 3), sigExpired: take(sPool, 4),
        verified: take(vPool, 382), approved: take(aPool, 410), signed: take(sPool, 368)
      };
      G.verPending.forEach(d => { d.verification = 'pending'; d.wf = { stage: 'verification' }; });
      G.verFailed.forEach(d => { d.verification = 'failed'; d.wf = { stage: 'verification' }; });
      G.verNotStarted.forEach(d => { d.verification = 'not_started'; d.wf = { stage: 'uploaded' }; });
      G.appPending.forEach(d => { d.approval = 'pending'; d.wf = { stage: 'approval' }; });
      G.appRejected.forEach(d => { d.approval = 'rejected'; d.wf = { stage: 'completed' }; });
      G.appNotSub.forEach(d => { d.approval = 'not_submitted'; d.wf = { stage: 'submitted' }; });
      G.sigPending.forEach(d => { d.signature = 'pending'; d.wf = { stage: 'signature' }; });
      G.sigPartial.forEach(d => { d.signature = 'partial'; d.wf = { stage: 'signature' }; });
      G.sigRejected.forEach(d => { d.signature = 'rejected'; d.wf = { stage: 'signature' }; });
      G.sigExpired.forEach(d => { d.signature = 'expired_request'; d.wf = { stage: 'signature' }; });
      G.verified.forEach(d => d.verification = 'verified');
      G.approved.forEach(d => d.approval = 'approved');
      G.signed.forEach(d => d.signature = 'signed');

      const settled = shuffle([...G.verified, ...G.approved, ...G.signed].filter((d, i, a) => a.indexOf(d) === i));
      settled.slice(0, 225).forEach(d => { d.wf = { stage: 'completed', completedDate: addDays(TODAY, -ri(1, 60)) }; });

      const filler = shuffle(live.filter(d => !used.has(d) && !d.isForm && !d.wf));
      filler.slice(0, 405).forEach(d => d.wf = { stage: 'uploaded' });
      filler.slice(405, 405 + 348).forEach(d => d.wf = { stage: 'submitted' });

      /* ---- workflow timing: SLA, elapsed, overdue, due today ---- */
      const overdueDays = shuffle([1, 2, 2, 1, 2, 1, 2, 3, 4, 5, 3, 5, 4, 3, 5, 6, 8, 9, 7, 10, 6, 12, 15, 20, 14, 25, 28, 34, 41]);
      const trackedPending = {
        verification: shuffle(G.verPending.slice()),
        approval: shuffle(G.appPending.slice()),
        signature: shuffle([...G.sigPending, ...G.sigPartial])
      };
      const plan = { verification: { over: 14, today: 8 }, approval: { over: 13, today: 6, watch: 5 }, signature: { over: 2, today: 4, watch: 2 } };
      Object.entries(trackedPending).forEach(([stage, arr]) => {
        const sla = SETTINGS.sla[stage], p = plan[stage];
        arr.forEach((d, i) => {
          d.wf.sla = sla; d.wf.tracked = true;
          if (i < p.over) { d.wf.overdueDays = overdueDays.pop(); d.wf.elapsed = sla + d.wf.overdueDays; }
          else if (i < p.over + p.today) { d.wf.overdueDays = 0; d.wf.elapsed = sla; }
          else if (p.watch && i < p.over + p.today + p.watch) { d.wf.overdueDays = 0; d.wf.elapsed = stage === 'approval' ? ri(6, sla - 1) : ri(8, sla - 1); }
          else { d.wf.overdueDays = 0; d.wf.elapsed = stage === 'signature' ? ri(0, 7) : stage === 'approval' ? ri(0, 5) : ri(0, sla - 1); }
        });
      });
      const subs = docs.filter(d => d.wf && d.wf.stage === 'submitted');
      shuffle(subs).forEach((d, i) => { d.wf.tracked = true; d.wf.sla = SETTINGS.sla.submitted; d.wf.overdueDays = 0; d.wf.elapsed = i < 8 ? d.wf.sla : ri(0, d.wf.sla - 1); });
      docs.forEach(d => {
        if (!d.wf) return;
        if (d.wf.elapsed == null) { d.wf.elapsed = d.wf.stage === 'completed' ? 0 : ri(0, 6); d.wf.overdueDays = 0; d.wf.sla = SETTINGS.sla[d.wf.stage] || null; }
        // workflow name
        const s = d.wf.stage;
        d.wf.name = s === 'signature' ? 'Document Sign-Off'
          : d.isForm ? 'KYC Review'
            : d.cat === 'Contract' ? (s === 'approval' ? 'Agreement Approval' : 'Contract Renewal')
              : s === 'verification' ? (d.cat === 'Identity' ? 'KYC Review' : 'Document Verification')
                : s === 'approval' ? 'Agreement Approval'
                  : pick(['Customer Document Update', 'Document Verification', 'Customer Document Update']);
        d.wf.assignee = s === 'completed' ? '—' : (s === 'verification' ? 'Verification Team · ' : '') + pick(STAFF);
        d.wf.entered = addDays(TODAY, -(d.wf.elapsed || 0));
      });

      /* ---- exceptions (74 in total, 12 critical, 18 over SLA) ---- */
      const excPool = [];
      const setExc = (d, code, critical) => { if (d.exc) return false; d.exc = { code, critical: !!critical, age: ri(0, 5), detail: '' }; excPool.push(d); return true; };
      const assign = (pool, code, n, critN) => { let c = 0; for (const d of pool) { if (c >= n) break; if (setExc(d, code, c < critN)) c++; } };
      assign(G.verFailed, 'Verification Failed', 9, 2);
      assign(G.sigPartial, 'Signature Missing', 8, 0);
      assign(shuffle(live.filter(d => d.expiry && d.expiry < TODAY)), 'Expired Document', 14, 5);
      assign(forms.filter(d => d.kyc === 'failed'), 'KYC Mismatch', 3, 3);
      assign(forms.filter(d => d.kyc === 'missing'), 'Missing Mandatory Document', 5, 2);
      const rest = shuffle(live.filter(d => !d.exc && !d.isForm));
      assign(rest, 'Missing Metadata', 18, 0);
      assign(rest, 'Incorrect Document Type', 7, 0);
      assign(rest, 'Duplicate', 6, 0);
      assign(newVer, 'Version Conflict', 4, 0);
      shuffle(excPool.slice()).slice(0, 18).forEach(d => d.exc.age = ri(6, 25));
      const excDetail = {
        'Missing Metadata': 'Required field "Document Number" is empty',
        'Expired Document': 'Document validity date has passed',
        'Verification Failed': 'Extracted values do not match the source record',
        'Signature Missing': 'Second signatory has not signed',
        'Incorrect Document Type': 'Content classified as a different document type',
        'Duplicate': 'Matches an existing document for the same customer',
        'Missing Mandatory Document': 'A mandatory supporting document is not on file',
        'Version Conflict': 'Two versions are marked as current',
        'KYC Mismatch': 'Customer details differ from the KYC record'
      };
      excPool.forEach(d => d.exc.detail = excDetail[d.exc.code]);

      docs.forEach(d => { d.hay = `${d.name} ${d.customer} ${d.account} ${d.docNo} ${d.type} ${d.cat} ${d.folder} ${d.sub} ${d.owner} ${d.uid}`.toLowerCase(); });
      return docs;
    }

    const DataSource = {
      // Swap for: return fetch('/api/documents').then(r => r.json())  (fields as generated above)
      load: () => Promise.resolve(generateDemoDocuments())
