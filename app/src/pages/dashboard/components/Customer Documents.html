    /* ==========================================================
       4. DERIVED FIELDS AND PREDICATES
       ========================================================== */
    function derive(d) {
      const live = !d.archived;
      d.expDays = d.expiry ? diffDays(d.expiry, TODAY) : null;
      d.retDays = d.retention ? diffDays(d.retention, TODAY) : null;
      d.kycDays = d.kycReview ? diffDays(d.kycReview, TODAY) : null;
      d.isExpired = live && d.expDays != null && d.expDays < 0;
      d.isExp30 = live && d.expDays != null && d.expDays >= 0 && d.expDays <= SETTINGS.expirySoonDays;
      d.retReached = live && d.retDays != null && d.retDays <= 0;
      d.retDue30 = live && d.retDays != null && d.retDays > 0 && d.retDays <= 30;
      d.retDue = d.retReached || d.retDue30;
      const cand = [];
      if (live && d.expDays != null) cand.push(d.expDays);
      if (live && d.retDays != null) cand.push(d.retDays);
      d.balance = cand.length ? Math.min(...cand) : null;
      d.balType = d.balance == null ? '' : (d.expDays != null && d.expDays <= d.retDays ? 'Expiry' : 'Retention');
      d.wfOverdue = !!(d.wf && d.wf.tracked && d.wf.overdueDays > 0);
      d.wfCritical = d.wfOverdue && d.wf.overdueDays > SETTINGS.criticalOverdueDays;
      d.sla = !(d.wf && d.wf.tracked) ? null : d.wf.overdueDays > 0 ? 'overdue' : d.wf.elapsed >= d.wf.sla ? 'today' : 'within';
      const sigBad = ['partial', 'expired_request', 'rejected'].includes(d.signature);
      d.state = (d.isExpired || (d.retReached && !d.hold) || ['expired', 'failed'].includes(d.kyc) || (d.exc && d.exc.critical) || d.wfCritical) ? 'critical'
        : (d.isExp30 || d.retDue || d.approval === 'pending' || d.verification === 'pending' || d.signature === 'pending' || sigBad || d.exc || d.wfOverdue || ['pending', 'review_due', 'missing'].includes(d.kyc)) ? 'attention' : 'valid';
      d.breach = d.isExpired || (d.retReached && !d.hold) || d.verification === 'failed' || !!d.exc || ['expired', 'failed', 'missing'].includes(d.kyc) || sigBad || d.wfCritical;
      const st = statusOf(d); d.statusLabel = st.label; d.statusKind = st.kind;
      d.docLabel = d.isExpired ? 'Expired' : d.isExp30 ? 'Expiring' : d.state === 'valid' ? 'Active' : 'Attention';
      d.risk = riskOf(d);
      return d;
    }

    function statusOf(d) {
      if (d.archived) return { label: 'Archived', kind: 'gray' };
      if (d.isExpired) return { label: 'Expired', kind: 'red' };
      if (d.retReached) return d.hold ? { label: 'Legal Hold', kind: 'purple' } : { label: 'Retention Due', kind: 'red' };
      if (d.exc) return { label: 'Exception', kind: d.exc.critical ? 'red' : 'orange' };
      if (d.wfOverdue) return { label: 'Workflow Overdue', kind: 'orange' };
      if (d.isExp30) return { label: 'Expiring', kind: 'orange' };
      if (d.retDue30) return { label: 'Retention Due', kind: 'orange' };
      if (d.approval === 'pending') return { label: 'Pending Approval', kind: 'purple' };
      if (d.verification === 'pending') return { label: 'Verification Pending', kind: 'cyan' };
      if (d.signature === 'pending') return { label: 'Signature Pending', kind: 'purple' };
      if (d.kyc === 'pending') return { label: 'KYC Pending', kind: 'cyan' };
      if (d.kyc === 'expired' || d.kyc === 'failed') return { label: 'KYC ' + (d.kyc === 'expired' ? 'Expired' : 'Failed'), kind: 'red' };
      if (d.kyc === 'review_due') return { label: 'KYC Review Due', kind: 'orange' };
      if (d.kyc === 'verified') return { label: 'KYC Verified', kind: 'green' };
      if (d.signature === 'signed') return { label: 'Signed', kind: 'green' };
      if (d.approval === 'approved') return { label: 'Approved', kind: 'green' };
      if (d.verification === 'verified') return { label: 'Verified', kind: 'green' };
      return { label: 'Active', kind: 'green' };
    }

    function riskOf(d) {
      if (d.archived) return { level: 'Low', obs: 'Document is archived and outside active retention monitoring.', action: 'No action required.' };
      if (d.isExpired) return { level: 'High', obs: `Document expired ${Math.abs(d.expDays)} day${Math.abs(d.expDays) === 1 ? '' : 's'} ago${d.newVersion ? ', a newer version has been received but is not yet verified' : ' and no replacement version has been received'}.`, action: d.newVersion ? 'Verify the new version and replace the expired one.' : 'Request an updated document from the document owner.' };
      if (d.exc && d.exc.critical) return { level: 'High', obs: `Critical exception: ${d.exc.code}. ${d.exc.detail}.`, action: 'Assign the exception to a reviewer and resolve it within the exception SLA.' };
      if (d.retReached) return { level: d.hold ? 'Medium' : 'High', obs: `Retention period ended ${Math.abs(d.retDays)} day${Math.abs(d.retDays) === 1 ? '' : 's'} ago${d.hold ? ', but a legal hold is active' : ' and the document has not been reviewed for archival'}.`, action: d.hold ? 'Confirm the legal hold with the Legal team before any disposition.' : 'Review the document for archival or a documented retention extension.' };
      if (d.wfCritical) return { level: 'High', obs: `${d.wf.name} is ${d.wf.overdueDays} days past its SLA at the ${STAGE_LABEL[d.wf.stage]} stage.`, action: 'Escalate to the stage owner and clear the queue.' };
      if (d.isExp30) return { level: d.expDays <= 14 ? 'Medium' : 'Low', obs: `Document expires in ${d.expDays} day${d.expDays === 1 ? '' : 's'}${d.newVersion ? ' and a new version has already been received' : ' and no replacement version has been received'}.`, action: d.newVersion ? 'Verify and approve the received version.' : 'Request updated document from document owner.' };
      if (d.exc) return { level: 'Medium', obs: `Open exception: ${d.exc.code}. ${d.exc.detail}.`, action: 'Resolve the exception and confirm the metadata.' };
      if (d.wfOverdue) return { level: 'Medium', obs: `${d.wf.name} is ${d.wf.overdueDays} day${d.wf.overdueDays === 1 ? '' : 's'} past its SLA.`, action: 'Remind the assignee and review the queue.' };
      if (['expired', 'failed'].includes(d.kyc)) return { level: 'High', obs: `KYC status is ${d.kyc}.`, action: 'Start a KYC review with the relationship owner.' };
      if (d.state === 'attention') return { level: 'Medium', obs: `Document is waiting for ${d.approval === 'pending' ? 'approval' : d.verification === 'pending' ? 'verification' : d.signature === 'pending' ? 'a signature' : d.kyc === 'pending' ? 'KYC review' : 'a follow-up action'}.`, action: 'Follow up with the assigned owner.' };
      return { level: 'Low', obs: 'No open issues. All lifecycle checks are within limits.', action: 'No action required.' };
    }

    const BUCKET = {
      exp: { 'expired': d => d.isExpired, '0-7': d => d.expDays != null && !d.archived && d.expDays >= 0 && d.expDays <= 7, '8-30': d => d.expDays != null && !d.archived && d.expDays >= 8 && d.expDays <= 30, '31-60': d => d.expDays != null && !d.archived && d.expDays >= 31 && d.expDays <= 60, '61-90': d => d.expDays != null && !d.archived && d.expDays >= 61 && d.expDays <= 90, '91+': d => d.expDays != null && !d.archived && d.expDays >= 91 },
      ret: { 'reached': d => d.retReached, '30': d => !d.archived && d.retDays != null && d.retDays > 0 && d.retDays <= 30, '60': d => !d.archived && d.retDays != null && d.retDays > 0 && d.retDays <= 60, '90': d => !d.archived && d.retDays != null && d.retDays > 0 && d.retDays <= 90, 'active': d => !d.archived && d.retDays != null && d.retDays > 90, 'hold': d => !d.archived && d.hold }
    };
    const AGE = { '0-2': [1, 2], '3-5': [3, 5], '6-10': [6, 10], '11-30': [11, 30], '30+': [31, 999] };

    const PRED = {
      all: () => true,
      active: d => !d.archived && !d.isExpired && !d.retReached,
      expired: d => d.isExpired,
      expiring: d => d.isExp30,
      retention_due: d => !d.archived && d.retDue,
      retention_reached: d => d.retReached,
      pending_approval: d => d.approval === 'pending',
      approved: d => d.approval === 'approved',
      pending_verification: d => d.verification === 'pending',
      verified: d => d.verification === 'verified',
      signature_pending: d => d.signature === 'pending',
      signed: d => d.signature === 'signed',
      kyc_pending: d => d.kyc === 'pending',
      kyc_verified: d => d.kyc === 'verified',
      workflow_overdue: d => d.wfOverdue,
      exception: d => !!d.exc,
      archived: d => d.archived,
      new_version: d => d.newVersion && !d.archived,
      attention: d => d.state === 'attention',
      critical: d => d.state === 'critical',
      valid: d => d.state === 'valid',
      appwatch: d => d.approval === 'pending' && d.wf && d.wf.elapsed > SETTINGS.approvalWatchDays,
      sigwatch: d => (d.signature === 'pending' || d.signature === 'partial') && d.wf && d.wf.elapsed > SETTINGS.signatureReminderDays,
      verbreach: d => d.verification === 'pending' && d.wfOverdue,
      exc_critical: d => !!d.exc && d.exc.critical,
      breach: d => d.breach
    };
    const KEY_LABEL = {
      all: 'All documents', active: 'Active', expired: 'Expired', expiring: 'Expiring in 30 days', retention_due: 'Retention due', retention_reached: 'Retention reached',
      pending_approval: 'Pending approval', approved: 'Approved', pending_verification: 'Pending verification', verified: 'Verified', signature_pending: 'Signature pending',
      signed: 'Signed', kyc_pending: 'KYC pending', kyc_verified: 'KYC verified', workflow_overdue: 'Workflow overdue', exception: 'Open exceptions', archived: 'Archived',
      new_version: 'New version received', attention: 'Needs attention', critical: 'Critical', valid: 'Valid', appwatch: 'Approvals pending over 5 days', sigwatch: 'Unsigned over 7 days',
      verbreach: 'Verification SLA breaches', exc_critical: 'Critical exceptions', breach: 'Compliance breaches'
    };
    const KEY_REPORT = {
      expired: 'Show me expired documents by folder', retention_due: 'Show me retention-due documents by folder', retention_reached: 'Show me documents that reached retention',
      pending_verification: 'Show me documents pending verification', pending_approval: 'Show me documents pending approval', workflow_overdue: 'Show me overdue workflows by stage',
      exception: 'Show me open exceptions by type', signature_pending: 'Show me documents pending signature', kyc_pending: 'Show me customers with pending KYC',
      expiring: 'Show me documents expiring in the next 30 days', attention: 'Show me documents requiring attention', new_version: 'Show me newly received document versions',
      appwatch: 'Show me approvals pending for more than 5 days', sigwatch: 'Show me documents unsigned for more than 7 days', verbreach: 'Show me verification SLA breaches',
      exc_critical: 'Show me critical exceptions', critical: 'Show me critical documents by folder', all: 'Show me all documents by folder',
      breach: 'Show me documents driving compliance breaches', valid: 'Show me fully compliant documents by folder'
    };
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const WF_LABEL = { overdue: 'Overdue' };
    function getPred(key) {
      if (!key) return null;
      if (PRED[key]) return PRED[key];
      const [p, v] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
      if (p === 'exp') return BUCKET.exp[v];
      if (p === 'ret') return BUCKET.ret[v];
      if (p === 'wf') return v === 'overdue' ? PRED.workflow_overdue : d => !!d.wf && d.wf.stage === v && !d.archived;
      if (p === 'wfo') return d => d.wfOverdue && d.wf.stage === v;
      if (p === 'exc') return d => !!d.exc && d.exc.code === v;
      if (p === 'sig') return d => d.signature === v;
      if (p === 'kyc') return d => d.kyc === v;
      if (p === 'app') return d => d.approval === v;
      if (p === 'ver') return d => d.verification === v;
      if (p === 'sla') return v === 'critical' ? (d => d.wfCritical) : (d => d.sla === v);
      if (p === 'age') return d => d.wfOverdue && d.wf.overdueDays >= AGE[v][0] && d.wf.overdueDays <= AGE[v][1];
      if (p === 'wfname') return d => !!d.wf && d.wf.name === v && !d.archived;
      if (p === 'folder') return d => d.folder === v;
      return null;
    }
    const EXP_LABEL = { 'expired': 'Expired', '0-7': '0–7 days', '8-30': '8–30 days', '31-60': '31–60 days', '61-90': '61–90 days', '91+': '91+ days' };
    const RET_LABEL = { reached: 'Retention reached', '30': 'Due within 30 days', '60': 'Due within 60 days', '90': 'Due within 90 days', active: 'Active retention', hold: 'Legal hold' };
    const KYC_LABEL = { verified: 'KYC verified', review_due: 'Review due', pending: 'KYC pending', expired: 'KYC expired', failed: 'KYC failed', missing: 'Missing documents' };
    function keyLabel(key) {
      if (KEY_LABEL[key]) return KEY_LABEL[key];
      const i = key.indexOf(':'), p = key.slice(0, i), v = key.slice(i + 1);
      if (p === 'exp') return 'Expiry: ' + EXP_LABEL[v];
      if (p === 'ret') return 'Retention: ' + RET_LABEL[v];
      if (p === 'wf') return v === 'overdue' ? 'Workflow overdue' : 'Workflow: ' + STAGE_LABEL[v];
      if (p === 'wfo') return 'Overdue at ' + STAGE_LABEL[v];
      if (p === 'exc') return 'Exception: ' + v;
      if (p === 'sig') return 'Signature: ' + ({ signed: 'Signed', pending: 'Pending', partial: 'Partially signed', rejected: 'Rejected', expired_request: 'Expired request' }[v]);
      if (p === 'kyc') return KYC_LABEL[v];
      if (p === 'app') return 'Approval: ' + ({ approved: 'Approved', pending: 'Pending', rejected: 'Rejected', not_submitted: 'Not submitted' }[v]);
      if (p === 'ver') return 'Verification: ' + ({ verified: 'Verified', pending: 'Pending', failed: 'Failed', not_started: 'Not started' }[v]);
      if (p === 'sla') return 'SLA: ' + ({ within: 'Within SLA', today: 'Due today', overdue: 'Overdue', critical: 'Critical overdue' }[v]);
      if (p === 'age') return 'Overdue ' + v + ' days';
      if (p === 'wfname') return 'Workflow: ' + v;
      if (p === 'folder') return v;
      return key;
    }
    function reportTitle(key) {
      if (KEY_REPORT[key]) return KEY_REPORT[key];
      const i = key.indexOf(':'), p = key.slice(0, i), v = key.slice(i + 1);
      if (p === 'exp') return v === 'expired' ? KEY_REPORT.expired : `Show me documents expiring in ${EXP_LABEL[v]}`;
      if (p === 'ret') return `Show me documents: ${RET_LABEL[v].toLowerCase()}`;
      if (p === 'wf') return v === 'overdue' ? KEY_REPORT.workflow_overdue : `Show me documents at the ${STAGE_LABEL[v]} stage`;
      if (p === 'exc') return `Show me ${v.toLowerCase()} exceptions`;
      return 'Show me ' + keyLabel(key).toLowerCase();
    }

    /* ==========================================================
       5. ANALYTICS ENGINE  (all counting happens here, never in the model)
       ========================================================== */
    function analyze(B) {
      const S = { total: B.length };
      const c = {
        expired: 0, exp30: 0, retReached: 0, retDue: 0, retReachedHold: 0, retReachedEligible: 0,
        pendApp: 0, pendVer: 0, sigPend: 0, kycPend: 0, exceptions: 0, newVer: 0, wfOverdue: 0, archived: 0
      };
      const expB = { expired: 0, '0-7': 0, '8-30': 0, '31-60': 0, '61-90': 0, '91+': 0 };
      const retB = { reached: 0, '30': 0, '60': 0, '90': 0, active: 0, hold: 0 };
      const stage = { uploaded: 0, submitted: 0, verification: 0, approval: 0, signature: 0, completed: 0 };
      const wfNames = {};
      const sla = { within: 0, today: 0, overdue: 0, critical: 0 };
      const aging = { '0-2': 0, '3-5': 0, '6-10': 0, '11-30': 0, '30+': 0 };
      const overdueByStage = { submitted: 0, verification: 0, approval: 0, signature: 0 };
      const app = { approved: 0, pending: 0, rejected: 0, not_submitted: 0 };
      const ver = { verified: 0, pending: 0, failed: 0, not_started: 0 };
      const sig = { signed: 0, pending: 0, partial: 0, rejected: 0, expired_request: 0 };
      const kyc = { verified: 0, review_due: 0, pending: 0, expired: 0, failed: 0, missing: 0 };
      const exc = {}; EXC_TYPES.forEach(t => exc[t] = 0);
      let excCritical = 0, excOverSla = 0, appOver5 = 0, sigOver7 = 0, verBreach = 0;
      let state = { valid: 0, attention: 0, critical: 0 }, breach = 0;
      const expFolder = {}, retReview = { ok: 0 };
      let expPast30 = 0;
      const work = { exp: [], ret: [], kyc: [] };
      const wk = [7, 14, 21, 28, 35, 42, 49, 56, 63, 70, 77, 84, 90];
      wk.forEach(() => { work.exp.push(0); work.ret.push(0); work.kyc.push(0); });
      let horizon = { exp: { 30: 0, 60: 0, 90: 0 }, ret: { 30: 0, 60: 0, 90: 0 }, kyc: { 30: 0, 60: 0, 90: 0 } };
      let recentReviews = 0;

      for (const d of B) {
        state[d.state]++; if (d.breach) breach++;
        if (d.archived) { c.archived++; continue; }
        if (d.isExpired) { c.expired++; if (d.expDays >= -30) expPast30++; }
        if (d.isExp30) { c.exp30++; expFolder[d.folder] = (expFolder[d.folder] || 0) + 1; }
        if (d.retReached) { c.retReached++; d.hold ? c.retReachedHold++ : c.retReachedEligible++; }
        if (d.retDue) c.retDue++;
        if (d.approval === 'pending') { c.pendApp++; if (d.wf && d.wf.elapsed > SETTINGS.approvalWatchDays) appOver5++; }
        if (d.verification === 'pending') { c.pendVer++; if (d.wfOverdue) verBreach++; }
        if (d.signature === 'pending') { c.sigPend++; }
        if ((d.signature === 'pending' || d.signature === 'partial') && d.wf && d.wf.elapsed > SETTINGS.signatureReminderDays) sigOver7++;
        if (d.kyc === 'pending') c.kycPend++;
        if (d.exc) { c.exceptions++; exc[d.exc.code]++; if (d.exc.critical) excCritical++; if (d.exc.age > SETTINGS.exceptionSlaDays) excOverSla++; }
        if (d.newVersion) c.newVer++;
        if (d.wfOverdue) { c.wfOverdue++; overdueByStage[d.wf.stage]++; for (const [k, [a, b]] of Object.entries(AGE)) if (d.wf.overdueDays >= a && d.wf.overdueDays <= b) aging[k]++; }
        if (d.sla) { sla[d.sla]++; if (d.wfCritical) sla.critical++; }
        if (d.wf) { stage[d.wf.stage]++; wfNames[d.wf.name] = (wfNames[d.wf.name] || 0) + 1; }
        if (d.approval !== 'na') app[d.approval]++;
        if (d.verification !== 'na') ver[d.verification]++;
        if (d.signature !== 'na') sig[d.signature]++;
        if (d.kyc !== 'na') kyc[d.kyc]++;
        for (const k of Object.keys(expB)) if (BUCKET.exp[k](d)) { expB[k]++; break; }
        for (const k of Object.keys(retB)) if (BUCKET.ret[k](d)) retB[k]++;
        // workload buckets (weekly, non-cumulative counts)
        if (d.expDays != null && d.expDays >= 0 && d.expDays <= 90) { const i = wk.findIndex(w => d.expDays <= w); work.exp[i]++; for (const h of [30, 60, 90]) if (d.expDays <= h) horizon.exp[h]++; }
        if (d.retDays != null && d.retDays >= 1 && d.retDays <= 90) { const i = wk.findIndex(w => d.retDays <= w); work.ret[i]++; for (const h of [30, 60, 90]) if (d.retDays <= h) horizon.ret[h]++; }
        if (d.kycDays != null && d.kycDays >= 0 && d.kycDays <= 90) { const i = wk.findIndex(w => d.kycDays <= w); work.kyc[i]++; for (const h of [30, 60, 90]) if (d.kycDays <= h) horizon.kyc[h]++; }
        if (d.wf && ['verification', 'approval', 'signature'].includes(d.wf.stage) && diffDays(TODAY, d.wf.entered) <= 30) recentReviews++;
        if (d.wf && d.wf.stage === 'completed' && d.wf.completedDate && diffDays(TODAY, d.wf.completedDate) <= 30) recentReviews++;
      }
      Object.assign(S, { c, expB, retB, stage, wfNames, sla, aging, overdueByStage, app, ver, sig, kyc, exc, excCritical, excOverSla, appOver5, sigOver7, verBreach, state, breach, expPast30, horizon });
      S.kycTotal = Object.values(kyc).reduce((s, v) => s + v, 0);
      S.excOpen = c.exceptions;
      S.expTotal = Object.values(expB).reduce((s, v) => s + v, 0);
      S.compliance = S.total ? +(100 * (1 - breach / S.total)).toFixed(1) : 100;
      S.topExpFolder = Object.entries(expFolder).sort((a, b) => b[1] - a[1])[0] || null;
      S.topException = Object.entries(exc).sort((a, b) => b[1] - a[1])[0];
      S.topOverdueStage = Object.entries(overdueByStage).sort((a, b) => b[1] - a[1])[0];
      S.work = { wk, ...work, dailyRate: recentReviews / 30 };

      // Document Health (configurable)
      const counts = {
        expired: c.expired, retentionOverdue: c.retReachedEligible, pendingVerification: c.pendVer, pendingApproval: c.pendApp,
        workflowOverdue: c.wfOverdue, openExceptions: c.exceptions, missingSignatures: sig.partial + sig.expired_request + sig.rejected,
        expiredKyc: kyc.expired, missingMandatory: kyc.missing
      };
      S.health = { components: [], score: 100 };
      let loss = 0;
      for (const cmp of SETTINGS.health.components) {
        const n = counts[cmp.key], den = cmp.den === 'kyc' ? S.kycTotal : S.total;
        const rate = den ? n / den : 0, pen = cmp.w * Math.min(1, rate / cmp.tol);
        loss += pen; S.health.components.push({ ...cmp, n, rate, pen });
      }
      S.health.score = Math.round(clamp(100 - loss, 0, 100));
      S.health.label = S.health.score >= SETTINGS.health.healthyAt ? 'Healthy' : S.health.score >= SETTINGS.health.watchAt ? 'Needs attention' : 'At risk';
      S.health.tone = S.health.score >= SETTINGS.health.healthyAt ? 'green' : S.health.score >= SETTINGS.health.watchAt ? 'orange' : 'red';
      return S;
    }

    function groupRows(B, mode) {
      const keyOf = { folder: d => d.folder, category: d => d.cat, repository: d => d.repo, department: d => d.dept }[mode];
      const m = new Map();
      for (const d of B) {
        const k = keyOf(d);
        if (!m.has(k)) m.set(k, { name: k, total: 0, active: 0, expired: 0, retDue: 0, pApp: 0, pVer: 0, exc: 0, breach: 0 });
        const r = m.get(k); r.total++;
        if (PRED.active(d)) r.active++;
        if (d.isExpired) r.expired++;
        if (!d.archived && d.retDue) r.retDue++;
        if (d.approval === 'pending') r.pApp++;
        if (d.verification === 'pending') r.pVer++;
        if (d.exc) r.exc++;
        if (d.breach) r.breach++;
      }
      return [...m.values()].map(r => ({ ...r, comp: r.total ? +(100 * (1 - r.breach / r.total)).toFixed(0) : 100 })).sort((a, b) => b.total - a.total);
    }

    /* ==========================================================
       6. RULE-BASED INSIGHTS (numbers come from the analytics engine)
       ========================================================== */
    function ruleInsights(S) {
      const c = S.c, out = [];
      if (!S.total) return out;
      // Expiry risk
      if (c.exp30 > 0) {
        const [f, n] = S.topExpFolder;
        out.push({ key: 'Expiry Risk', sev: c.exp30 > 100 ? 'high' : 'medium', drill: 'expiring', text: `${fmt(c.exp30)} documents will expire within the next 30 days. ${f} represents ${pct(n, c.exp30)}% of these documents.` });
      } else out.push({ key: 'Expiry Risk', sev: 'low', drill: 'expiring', text: 'No documents are due to expire within the next 30 days.' });
      // Workflow
      if (c.wfOverdue > 0) {
        const [st, n] = S.topOverdueStage;
        out.push({ key: 'Workflow', sev: 'high', drill: 'workflow_overdue', text: `${fmt(c.wfOverdue)} document workflows are overdue. ${STAGE_LABEL[st]} is responsible for ${pct(n, c.wfOverdue)}% of the overdue items.` });
      } else out.push({ key: 'Workflow', sev: 'low', drill: 'workflow_overdue', text: 'No document workflows are past their SLA.' });
      // Retention
      if (c.retReached > 0 || c.retDue > 0) {
        out.push({ key: 'Retention', sev: c.retReachedEligible > 0 ? 'high' : 'medium', drill: 'retention_due', text: `${fmt(c.retReached)} documents reached their retention period. ${fmt(c.retReachedEligible)} are eligible for archival review while ${fmt(c.retReachedHold)} are under legal hold. ${fmt(c.retDue - c.retReached)} more fall due within 30 days.` });
      } else out.push({ key: 'Retention', sev: 'low', drill: 'retention_due', text: 'No documents have reached or are approaching their retention period.' });
      // Approval
      out.push({ key: 'Approval', sev: c.pendApp > 0 ? 'medium' : 'low', drill: c.pendApp ? 'pending_approval' : 'approved', text: c.pendApp ? `${fmt(c.pendApp)} documents are awaiting approval, including ${fmt(S.appOver5)} items pending for more than ${SETTINGS.approvalWatchDays} business days.` : 'No documents are waiting for approval.' });
      // Verification
      out.push({ key: 'Verification', sev: S.verBreach > 0 ? 'high' : c.pendVer ? 'medium' : 'low', drill: c.pendVer ? 'pending_verification' : 'verified', text: c.pendVer ? `${fmt(c.pendVer)} documents remain unverified. ${fmt(S.verBreach)} have exceeded their verification SLA.` : 'All submitted documents have been verified.' });
      // Signature
      out.push({ key: 'Signature', sev: S.sigOver7 > 0 ? 'medium' : 'low', drill: c.sigPend ? 'signature_pending' : 'signed', text: c.sigPend ? `${fmt(c.sigPend)} documents are awaiting signatures. ${fmt(S.sigOver7)} have remained unsigned for more than ${['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'][SETTINGS.signatureReminderDays] || SETTINGS.signatureReminderDays} days.` : 'No signature requests are pending.' });
      // KYC
      if (S.kyc.expired > 0) out.push({ key: 'KYC', sev: 'high', drill: 'kyc:expired', text: `${fmt(S.kyc.expired)} customers currently have expired KYC documents and require immediate review.` });
      // Exception
      if (c.exceptions > 0) out.push({ key: 'Exception', sev: S.excCritical > 0 ? 'high' : 'medium', drill: 'exc:' + S.topException[0], text: `${S.topException[0]} is currently the most frequent document exception (${fmt(S.topException[1])} of ${fmt(c.exceptions)} open). ${fmt(S.excCritical)} are critical.` });
      else out.push({ key: 'Exception', sev: 'low', drill: 'exception', text: 'There are no open document exceptions.' });
      // Projection
      const n30 = S.horizon.exp[30], prev = S.expPast30;
      const trend = n30 > prev * 1.1 ? 'increase' : n30 < prev * 0.9 ? 'decrease' : 'stay stable';
      out.push({ key: 'Projection', sev: trend === 'increase' ? 'medium' : 'low', drill: 'expiring', text: `Based on current expiry dates, document renewal workload is expected to ${trend} during the next 30 days (${fmt(n30)} scheduled expirations compared with ${fmt(prev)} in the last 30 days).` });
      return out;
    }

    /* ==========================================================
       7. AI PROVIDER LAYER  (UI never talks to a model directly)
       ========================================================== */
    const SYSTEM_PROMPT = 'You are a DMS document intelligence analyst. Analyze the supplied document metadata summary. Identify operational risks, compliance issues, unusual trends, workflow bottlenecks, upcoming expirations, retention risks and actions requiring management attention. Do not invent data. Provide a maximum of five concise insights. For each insight return a title, severity, observation and recommended action. Respond with JSON only: an array of objects with the keys "title", "severity" (high, medium or low), "observation" and "action".';

    class AIProvider {
      constructor(cfg) { this.cfg = cfg; }
      get base() { return String(this.cfg.AI_BASE_URL || '').replace(/\/+$/, ''); }
      async complete() { throw new Error('Not implemented'); }
      async ping() { throw new Error('Not implemented'); }
      async timeoutFetch(url, opts, ms = 60000) {
        const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
        try { const r = await fetch(url, { ...opts, signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return r; } finally { clearTimeout(t); }
      }
    }
    class OllamaProvider extends AIProvider {
      async complete(system, user) {
        const r = await this.timeoutFetch(this.base + '/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: this.cfg.AI_MODEL, prompt: system + '\n\nDATA:\n' + user, stream: false, format: 'json', options: { temperature: 0.2 } }) }, 90000);
        return (await r.json()).response;
      }
      async ping() { const r = await this.timeoutFetch(this.base + '/api/tags', {}, 4000); const j = await r.json(); return (j.models || []).map(m => m.name); }
    }
    class OpenAICompatProvider extends AIProvider {
      async complete(system, user) {
        const r = await this.timeoutFetch(this.base + '/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: this.cfg.AI_MODEL, temperature: 0.2, messages: [{ role: 'system', content: system }, { role: 'user', content: 'DATA:\n' + user }] }) }, 90000);
        const j = await r.json(); return j.choices && j.choices[0] && j.choices[0].message.content;
      }

    function createProvider(cfg) {
      if (!cfg.AI_ENABLED) return null;
      if (cfg.AI_PROVIDER === 'ollama') return new OllamaProvider(cfg);
      if (cfg.AI_PROVIDER === 'openai') return new OpenAICompatProvider(cfg);
      return null;
    }
    function parseInsightJSON(txt) {
      if (!txt) return null;
      let t = String(txt).trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      let v; try { v = JSON.parse(t); } catch (e) { const m = t.match(/\[[\s\S]*\]/); if (!m) return null; try { v = JSON.parse(m[0]); } catch (e2) { return null; } }
      if (!Array.isArray(v)) v = v && (v.insights || v.items || v.data);
      if (!Array.isArray(v)) return null;
      const items = v.filter(x => x && x.title && x.observation).slice(0, 5).map(x => ({
        title: String(x.title), severity: ['high', 'medium', 'low'].includes(String(x.severity).toLowerCase()) ? String(x.severity).toLowerCase() : 'medium',
        observation: String(x.observation), action: String(x.action || '')
      }));
      return items.length ? items : null;
    }

        signaturePending: c.sigPend, signaturePendingOver7Days: S.sigOver7, kycPending: c.kycPend, kycExpired: S.kyc.expired, kycMissingDocuments: S.kyc.missing,
        openExceptions: c.exceptions, criticalExceptions: S.excCritical, exceptionsOverSla: S.excOverSla, exceptionsByType: S.exc, newVersionsReceived: c.newVer,

      if (S.excCritical) add(`Resolve ${fmt(S.excCritical)} Critical Exceptions`, 'High', 'exc_critical', 'Critical exceptions are open past their SLA', 'triangle-alert');
      if (c.sigPend) add(`Follow Up ${fmt(c.sigPend)} Signature Requests`, 'Medium', 'signature_pending', `${fmt(S.sigOver7)} unsigned for more than ${SETTINGS.signatureReminderDays} days`, 'pen-line');
      const meta = S.exc['Missing Metadata'];
      if (meta) add(`Resolve ${fmt(meta)} Metadata Exceptions`, 'Medium', 'exc:Missing Metadata', 'Complete required index fields', 'file-text');
      if (c.pendApp) add(`Clear ${fmt(c.pendApp)} Pending Approvals`, S.appOver5 ? 'Medium' : 'Low', 'pending_approval', `${fmt(S.appOver5)} have waited more than ${SETTINGS.approvalWatchDays} business days`, 'circle-check');
      const w = { Critical: 0, High: 1, Medium: 2, Low: 3 };

    function buildNotifications(S, B, aiItems) {

    function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
    function deltaOf(key, val) {
      if (!val) return { p: 0, cls: '' };
      const h = hash(key + state.timeframe + state.repo + state.folder);
      let p = Math.round(((h % 3100) / 100) - 11);

      return { p, cls: p > 0 ? 'bad' : p < 0 ? 'good' : '' };

    }
    function donut(segs, top, sub) {
      const r = 58, C = 2 * Math.PI * r, tot = segs.reduce((s, x) => s + x.v, 0);
      let off = 0;
      const arcs = segs.map(s => {
        if (!tot || !s.v) return '';
        const len = C * s.v / tot, gap = segs.filter(x => x.v).length > 1 ? 2 : 0, dash = Math.max(0, len - gap);
        const el = `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${dash} ${C - dash}" stroke-dashoffset="${-off}" data-tip="${esc(s.n)}: ${fmt(s.v)} (${pct(s.v, tot)}%)"></circle>`;
        off += len; return el;
      }).join('');
      return `<div class="donut"><svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="${esc(top + ' ' + sub)}"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--gray-3)" stroke-width="16"/>${arcs}</svg><div class="ctr"><div><b>${top}</b><span>${sub}</span></div></div></div>`;
    }
    function donutCard(title, sub, segs, insight) {

      return cardHead(title, sub) + `<div class="card-b">${tot ? `<div class="donut-wrap">${donut(segs, fmt(tot), 'tracked')}<div class="dl">${legend}</div></div>` : '<div class="empty">No documents in this view.</div>'}${insight ? `<div class="insight-line">${ic('info', 15)}<div>${insight}</div></div>` : ''}</div>`;

        { key: 'new_version', label: 'New Version Received', val: c.newVer, tone: 'green' },
        { key: 'workflow_overdue', label: 'Workflow Overdue', val: c.wfOverdue, tone: 'orange' },

        : [['reached', 'Retention Reached', 'var(--red-9)'], ['30', 'Due within 30 days', 'var(--orange-9)'], ['60', 'Due within 60 days', 'color-mix(in srgb,var(--orange-9) 65%,#fff)'], ['90', 'Due within 90 days', 'var(--primary)'], ['active', 'Active Retention', 'var(--green-9)'], ['hold', 'Legal Hold', 'var(--secondary)']];

        `<div class="card-b" style="padding-top:8px">${rows.map(([k, l, col]) => hbar(l, B[k], max, col, `data-act="drill" data-key="${pre}${k}"`, state.drill === pre + k)).join('')}

      $('#kyc').innerHTML = cardHead('KYC Document Status', `${fmt(S.kycTotal)} customer KYC records`) + `<div class="card-b">${rows.map(([key, l, col]) => hbar(l, k[key], max, col, `data-act="drill" data-key="kyc:${key}"`, state.drill === 'kyc:' + key, true)).join('')}

      $('#folders').innerHTML = cardHead('Document Health by Folder', 'Click a row to filter the whole dashboard.', `<div class="seg-tabs">${Object.entries(labels).map(([k, l]) => `<button class="${mode === k ? 'on' : ''}" data-act="groupMode" data-v="${k}">${l}</button>`).join('')}</div>`) +
        `<div class="card-b"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>${labels[mode]}</th><th class="num">Total</th><th class="num">Active</th><th class="num">Expired</th><th class="num">Retention Due</th><th class="num">Pending Approval</th><th class="num">Pending Verification</th><th class="num">Exceptions</th><th class="num">Compliance %</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="row ${state[setKey] === r.name ? 'sel' : ''}" data-act="groupPick" data-mode="${setKey}" data-name="${esc(r.name)}"><td><span class="link-cell">${esc(r.name)}</span></td><td class="num">${fmt(r.total)}</td><td class="num">${fmt(r.active)}</td><td class="num">${fmt(r.expired)}</td><td class="num">${fmt(r.retDue)}</td><td class="num">${fmt(r.pApp)}</td><td class="num">${fmt(r.pVer)}</td><td class="num">${fmt(r.exc)}</td><td class="num"><div class="comp"><div class="prog"><i style="width:${r.comp}%;background:${compCls(r.comp)}"></i></div><b>${r.comp}%</b></div></td></tr>`).join('') || `<tr><td colspan="9" class="empty">No documents match the current filters.</td></tr>`}

      const aiBlock = ai ? `<div class="ai-block"><div class="hd">${ic('sparkles', 15)} Model insights (${esc(AI_STATE.source)})</div>${ai.map(i => `<div class="ai-item"><div class="t">${esc(i.title)} <span class="badge ${SEV_TONE[i.severity] === 'red' ? 'red' : SEV_TONE[i.severity] === 'orange' ? 'orange' : 'cyan'}">${i.severity}</span></div><div>${fmtInsightText(i.observation)}</div>${i.action ? `<div class="a"><b>Recommended:</b> ${fmtInsightText(i.action)}</div>` : ''}</div>`).join('')}</div>` : '';
      const err = AI_STATE.error ? `<div class="note" style="color:var(--orange-ink);margin-bottom:8px">${ic('triangle-alert', 14)} ${esc(AI_STATE.error)} Showing rule-based insights.</div>` : '';

    <div class="foot-note">${ic('shield-check', 15)}<div>Recommendations never delete, approve, verify or modify a document. A person must take every action.</div></div></div>`;

    function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, v)))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
    function renderWorkload() {
      const W = 660, H = 236, pl = 42, pr = 16, pt = 16, pb = 30, wk = S.work.wk, hz = S.horizon;
      const cum = a => { let s = 0; return a.map(v => s += v); };
      const ex = cum(S.work.exp), rt = cum(S.work.ret), ky = cum(S.work.kyc), wf = wk.map(d => Math.round(S.work.dailyRate * d));
      const ymax = niceMax(Math.max(1, ...ex, ...rt, ...ky, ...wf));
      const x = d => pl + (W - pl - pr) * d / 90, y = v => pt + (H - pt - pb) * (1 - v / ymax);
      const line = (arr, col, dash, label) => {
        const pts = [[0, 0], ...arr.map((v, i) => [wk[i], v])];
        return `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" ${dash ? 'stroke-dasharray="6 5"' : ''}/>` +
          pts.filter(p => p[0] > 0).map(p => `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="9" fill="transparent" data-tip="Day ${p[0]}: ${fmt(p[1])} ${label}"></circle>`).join('');
      };
      const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${y(ymax * f)}" y2="${y(ymax * f)}" stroke="var(--gray-3)"/><text x="${pl - 8}" y="${y(ymax * f) + 4}" text-anchor="end">${fmt(ymax * f)}</text>`).join('');
      const marks = [0, 30, 60, 90].map(d => `${d ? `<line x1="${x(d)}" x2="${x(d)}" y1="${pt}" y2="${H - pb}" stroke="var(--gray-3)" stroke-dasharray="3 4"/>` : ''}<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${d ? d + ' days' : 'Today'}</text>`).join('');
      const areaPts = [[0, 0], ...ex.map((v, i) => [wk[i], v])];
      const area = `<path d="M${x(0)} ${y(0)} ${areaPts.map(p => 'L' + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ')} L${x(90)} ${y(0)} Z" fill="var(--primary)" opacity=".08"/>`;
      const est = n => `<span class="est">Trend projection</span>`;
      const tile = h => `<div class="wl-tile"><h4>Next ${h} days</h4><div><span>Expirations</span><b>${fmt(hz.exp[h])}</b></div><div><span>Retention reviews</span><b>${fmt(hz.ret[h])}</b></div><div><span>KYC reviews</span><b>${fmt(hz.kyc[h])}</b></div><div><span>Workflow reviews${est()}</span><b>~${fmt(Math.round(S.work.dailyRate * h))}</b></div></div>`;
      $('#workload').innerHTML = cardHead('Upcoming Workload', 'Scheduled work uses known dates. Workflow reviews are a trend projection, not confirmed activity.') + `<div class="card-b">
    <svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative upcoming workload over the next 90 days">${grid}${marks}${area}${line(rt, 'var(--secondary)', false, 'retention reviews')}${line(ky, 'var(--orange-9)', false, 'KYC reviews')}${line(wf, 'var(--gray-10)', true, 'workflow reviews (trend projection)')}${line(ex, 'var(--primary)', false, 'expirations')}</svg>
    <div class="chart-legend"><span style="--c:var(--primary)"><i></i>Expirations</span><span style="--c:var(--secondary)"><i></i>Retention reviews</span><span style="--c:var(--orange-9)"><i></i>KYC reviews</span><span style="--c:var(--gray-10)"><i class="dash"></i>Workflow reviews (trend projection)</span></div>
    <div class="wl-tiles">${tile(30)}${tile(60)}${tile(90)}</div></div>`;
    }

    function notifList() { return buildNotifications(S, BASE, AI_STATE.items); }
    function renderNotifsCard() {

    <div class="pcard"><h4>${ic('shield-check', 17)} Compliance</h4>${kv('Approval', mapBadge(APPR, d.approval))}${kv('Verification', mapBadge(VERF, d.verification))}${kv('Signature', mapBadge(SIGN, d.signature))}${kv('KYC', mapBadge(KYCB, d.kyc))}${kv('Retention', d.archived ? badge('Archived', 'gray') : d.retReached ? badge(d.hold ? 'Legal Hold' : 'Reached', d.hold ? 'purple' : 'red') : d.retDue30 ? badge('Due in ' + d.retDays + 'd', 'orange') : badge('Active', 'green'))}${d.exc ? kv('Exception', badge(d.exc.code, d.exc.critical ? 'red' : 'orange')) : ''}</div>

  </div>`;

      return `<div class="side-h"><div><h3>AI settings</h3><div class="sub">Configurable free or local model. No commercial provider is required.</div></div><button class="icon-btn" data-act="closePanel" aria-label="Close settings">${ic('x', 18)}</button></div>
  <div class="side-b"><div class="pcard"><h4>${ic('bot', 17)} Model endpoint</h4><div class="ai-set" style="padding:4px 16px 16px">
    <label class="lb" for="aiProv">AI_PROVIDER</label><select id="aiProv" data-change="aiProv"><option value="rules" ${c.AI_PROVIDER === 'rules' ? 'selected' : ''}>Rules engine only</option><option value="ollama" ${c.AI_PROVIDER === 'ollama' ? 'selected' : ''}>Ollama</option><option value="openai" ${c.AI_PROVIDER === 'openai' ? 'selected' : ''}>OpenAI-compatible (LM Studio, vLLM, llama.cpp)</option></select>
    <label class="lb" for="aiModel">AI_MODEL</label><input id="aiModel" type="text" value="${esc(c.AI_MODEL)}" placeholder="gemma, qwen, llama, mistral..." data-input="aiModel">
    <label class="lb" for="aiBase">AI_BASE_URL</label><input id="aiBase" type="text" value="${esc(c.AI_BASE_URL)}" data-input="aiBase">
    <label class="sw"><input type="checkbox" data-change="aiEnabled" ${c.AI_ENABLED ? 'checked' : ''}> Use the model to write insights</label>
    <div class="row"><button class="btn-secondary" data-act="aiTest">Test connection</button><button class="btn-primary" style="height:36px" data-act="aiApply">Apply</button></div>
    <div class="st" id="aiStatus">${esc(AI_STATE.status || 'Not tested. Browsers may block a local server unless CORS is allowed (for Ollama set OLLAMA_ORIGINS).')}</div></div></div>
  <div class="pcard"><h4>${ic('layers', 17)} Data sent to the model</h4><div style="padding:12px 16px"><p class="note" style="margin-bottom:8px">Only aggregated counts leave the page. All counting is done by the analytics engine, never by the model. No document content or customer names are sent.</p><pre class="json">${esc(JSON.stringify(sum, null, 2))}</pre><div style="margin-top:8px"><button class="link" data-act="copyJSON">${ic('copy', 14)} Copy JSON</button></div></div></div>
  <div class="pcard"><h4>${ic('info', 17)} Architecture</h4><div style="padding:12px 16px" class="note">DMS metadata → analytics engine → structured JSON summary → <code>AIProvider</code> → management insight. Swap the model by changing the three settings above. The UI only calls <code>generateDocumentInsights(data)</code>.</div></div></div>`;
    }
    function renderSide() {
      const side = $('#side');
      if (!state.panel) { side.hidden = true; side.innerHTML = ''; return; }
      const keep = side.scrollTop;
      side.hidden = false;
      side.innerHTML = state.panel === 'doc' ? docPanel() : state.panel === 'notifications' ? notifPanel() : aiPanel();
      if (side.dataset.p === state.panel + (state.docId || '')) side.scrollTop = keep; else side.scrollTop = 0;
      side.dataset.p = state.panel + (state.docId || '');
    }

    /* ==========================================================
       14. RENDER ALL, AI REFRESH
       ========================================================== */
    function renderDashboard() {
      renderCommand(); renderKPIs(); renderHealth(); renderWatch(); renderWorkflow(); renderApproval(); renderVerification(); renderSLA();
      renderSignature(); renderKYC(); renderExceptions(); renderFolders(); renderInsights(); renderActions(); renderWorkload(); renderNotifsCard(); renderAttention(); renderRegister();
      renderSectionStates();
    }
    function renderAll() {
      BASE = baseFilter();
      S = analyze(BASE);
      $('#viewDashboard').hidden = state.view !== 'dashboard';
      $('#viewReport').hidden = state.view !== 'report';
      renderSubhead(); renderPills();
      if (state.view === 'dashboard') renderDashboard(); else { renderReport(); renderNotifsCard(); }
      renderSide();
      scheduleAI();
    }
    let aiTimer = null, aiSeq = 0;
    function scheduleAI(now) {
      clearTimeout(aiTimer);
      if (!CONFIG.AI_ENABLED || CONFIG.AI_PROVIDER === 'rules') { AI_STATE.items = null; AI_STATE.loading = false; return; }
      aiTimer = setTimeout(runAI, now ? 0 : 900);
    }
    async function runAI() {
      const my = ++aiSeq; AI_STATE.loading = true; AI_STATE.error = '';
      if (state.view === 'dashboard') renderInsights();
      try {
        const r = await generateDocumentInsights(buildSummary(S, activeFilterDesc()));
        if (my !== aiSeq) return;
        AI_STATE.items = r.items; AI_STATE.source = r.source;
      } catch (e) {
        if (my !== aiSeq) return;
        AI_STATE.items = null; AI_STATE.error = 'Model unavailable: ' + (e.name === 'AbortError' ? 'request timed out.' : e.message + '.');
      }
      AI_STATE.loading = false;
      if (state.view === 'dashboard') { renderInsights(); renderNotifsCard(); }
      if (state.panel === 'notifications') renderSide();
    }


    /* ==========================================================
       15. FOCUS-SAFE RENDER WRAPPER
       ========================================================== */
    function render() {
      const ae = document.activeElement;
      const keep = ae && ae.id && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT') ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
      renderAll();
      if (keep) {
        const el = document.getElementById(keep.id);
        if (el) { el.focus({ preventScroll: true }); if (typeof keep.s === 'number' && el.setSelectionRange) { try { el.setSelectionRange(keep.s, keep.e); } catch (err) { } } }
      }
    }

    /* ==========================================================
       16. TOOLTIP
       ========================================================== */
    let tipEl, tipTimer;
    function positionTip(el) {
      const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
      let top = r.top - th - 8, left = r.left + r.width / 2 - tw / 2;
      if (top < 4) top = r.bottom + 8;
      left = Math.max(4, Math.min(left, window.innerWidth - tw - 4));
      tipEl.style.top = top + 'px'; tipEl.style.left = left + 'px';
    }
    function showTip(el) {
      const text = el.getAttribute('data-tip'); if (!text) return;
      clearTimeout(tipTimer);
      tipEl.textContent = text; tipEl.classList.add('on');
      positionTip(el);
    }
    function hideTip() { tipEl.classList.remove('on'); }

    /* ==========================================================
       17. TOAST
       ========================================================== */
    let toastTimer;
    function toast(msg) {
      const t = $('#toast'); t.textContent = msg; t.classList.add('on');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2800);
    }

    /* ==========================================================
       18. FLOATING ROW MENU (ellipsis actions — contextual anchor, not a modal)
       ========================================================== */
    let floatMenuOpen = false;
    function hideFloatMenu() { const fm = $('#floatMenu'); if (fm) { fm.hidden = true; fm.innerHTML = ''; } floatMenuOpen = false; }
    function openRowMenu(btn, id) {
      const fm = $('#floatMenu');
      fm.innerHTML = `<button class="opt" data-act="doc" data-id="${id}">${ic('file-text', 15)}<span>View details</span></button>
    <button class="opt" data-act="fmDownload" data-id="${id}">${ic('download', 15)}<span>Download</span></button>
    <button class="opt" data-act="fmCopy" data-id="${id}">${ic('external-link', 15)}<span>Copy link</span></button>`;
      fm.hidden = false;
      const r = btn.getBoundingClientRect(), fw = fm.offsetWidth || 190, fh = fm.offsetHeight || 120;
      fm.style.top = Math.max(8, Math.min(window.innerHeight - fh - 8, r.bottom + 6)) + 'px';
      fm.style.left = Math.max(8, Math.min(window.innerWidth - fw - 8, r.right - fw)) + 'px';
      floatMenuOpen = true;
    }

    /* ==========================================================
       19. CSV EXPORT
       ========================================================== */
    function csvCell(k, d) {
      switch (k) {
        case 'name': return d.name;
        case 'status': return d.statusLabel;
        case 'folder': return d.folder;
        case 'category': return d.cat;
        case 'type': return d.type;
        case 'customer': return d.customer + ' / ' + d.account;
        case 'workflow': return d.wf ? `${d.wf.name} - ${STAGE_LABEL[d.wf.stage]}${d.wfOverdue ? ' (overdue)' : ''}` : '';
        case 'approval': return APPR[d.approval] ? APPR[d.approval][0] : '';
        case 'verification': return VERF[d.verification] ? VERF[d.verification][0] : '';
        case 'signature': return SIGN[d.signature] ? SIGN[d.signature][0] : '';
        case 'kyc': return KYCB[d.kyc] ? KYCB[d.kyc][0] : '';
        case 'retention': return d.retention ? fmtDate(d.retention) : '';
        case 'expiry': return d.expiry ? fmtDate(d.expiry) : '';
        case 'balance': return d.balance == null ? '' : d.balance;
        case 'exception': return d.exc ? d.exc.code : '';
        case 'owner': return d.owner;
        default: return '';
      }
    }
    function toCSV(rows, cols) {
      const esc2 = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      const head = cols.map(k => esc2(COLS[k].l)).join(',');
      const body = rows.map(d => cols.map(k => esc2(csvCell(k, d))).join(',')).join('\n');
      return head + '\n' + body;
    }
    function downloadCSV(rows, cols, name) {
      const csv = toCSV(rows, cols);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${name}-${fmtDate(TODAY)}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast(`${fmt(rows.length)} rows exported to CSV.`);
    }

    /* ==========================================================
       20. ACTION HANDLING
       ========================================================== */
    function resetPage(scope) { if (state[scope]) state[scope].page = 1; }

    function handleAction(btn, e) {
      const act = btn.dataset.act;
      if (act !== 'rowMenu') hideFloatMenu();
      switch (act) {
        case 'menu': {
          const m = btn.dataset.m;
          state.openMenu = state.openMenu === m ? null : m;
          break;
        }
        case 'setFilter': {
          const f = btn.dataset.f, v = btn.dataset.v;
          state[f] = v;
          if (f === 'repo') { state.folder = ''; state.docType = ''; }
          if (f === 'folder') { state.docType = ''; }
          state.openMenu = null; state.drill = null;
          resetPage('reg'); resetPage('rep');
          break;
        }
        case 'clearFilter': {
          const f = btn.dataset.f;
          if (f === 'timeframe') state.timeframe = 'month'; else state[f] = '';
          if (f === 'repo') { state.folder = ''; state.docType = ''; }
          state.openMenu = null;
          resetPage('reg'); resetPage('rep');
          break;
        }
        case 'clearAll': {
          state.owner = ''; state.dept = ''; state.holdOnly = false; state.search = ''; state.openMenu = null;
          const gs = $('#globalSearch'); if (gs) gs.value = '';
          resetPage('reg');
          break;
        }
        case 'sectionToggle': {
          const key = btn.dataset.section;
          if (key && Object.prototype.hasOwnProperty.call(state.sections, key)) state.sections[key] = !state.sections[key];
          break;
        }
        case 'drill': {
          const key = btn.dataset.key;
          state.drill = state.drill === key ? null : key;
          resetPage('reg');
          $('#register') && $('#register').scrollIntoView({ behavior: 'smooth', block: 'start' });
          break;
        }
        case 'clearDrill': state.drill = null; resetPage('reg'); break;
        case 'watch': state.watchMode = btn.dataset.v; break;
        case 'groupMode': state.groupMode = btn.dataset.v; break;
        case 'groupPick': {
          const mode = btn.dataset.mode, name = btn.dataset.name;
          state[mode] = state[mode] === name ? '' : name;
          resetPage('reg'); resetPage('rep');
          break;
        }
        case 'report': {
          state.view = 'report'; state.rep.key = btn.dataset.key; state.rep.cols = null;
          state.rep.page = 1; state.rep.search = ''; state.rep.sort = { col: 'folder', dir: 'asc' };
          state.panel = null;
          $('#scroll') && $('#scroll').scrollTo(0, 0);
          break;
        }
        case 'backReport': state.view = 'dashboard'; break;
        case 'doc': {
          state.panel = 'doc'; state.docId = Number(btn.dataset.id); state.docTab = 'timeline';
          break;
        }
        case 'docTab': state.docTab = btn.dataset.v; break;
        case 'closePanel': state.panel = null; break;
        case 'panel': {
          const p = btn.dataset.p;
          state.panel = state.panel === p ? null : p;
          break;
        }
        case 'notif': {
          const list = notifList(), n = list.find(x => x.id === btn.dataset.id);
          if (n) {
            state.read.add(n.id);
            if (n.doc != null) { state.panel = 'doc'; state.docId = n.doc; state.docTab = 'timeline'; }
            else if (n.key) { state.view = 'report'; state.rep.key = n.key; state.rep.cols = null; state.rep.page = 1; state.rep.sort = { col: 'folder', dir: 'asc' }; state.panel = null; }
          }
          break;
        }
        case 'readAll': { notifList().forEach(n => state.read.add(n.id)); break; }
        case 'sort': {
          const scope = btn.dataset.scope, col = btn.dataset.col, s = state[scope].sort;
          if (s.col === col) s.dir = s.dir === 'asc' ? 'desc' : 'asc'; else { s.col = col; s.dir = 'asc'; }
          break;
        }
        case 'page': { state[btn.dataset.scope].page = Number(btn.dataset.p); break; }
        case 'csv': {
          const scope = btn.dataset.scope;
          const rows = scope === 'reg' ? registerData() : reportRows();
          const cols = scope === 'reg' ? REG_COLS : state.rep.cols;
          downloadCSV(rows, cols, scope === 'reg' ? 'document-register' : 'report');
          return; // no re-render needed
        }
        case 'rowMenu': {
          const id = btn.dataset.id;
          if (floatMenuOpen) { hideFloatMenu(); return; }
          openRowMenu(btn, id);
          return; // no full re-render needed
        }
        case 'fmDownload': hideFloatMenu(); toast('Download started.'); return;
        case 'fmCopy': hideFloatMenu(); toast('Link copied to clipboard.'); return;
        case 'share': toast('A view-only link has been copied to your clipboard.'); return;
        case 'refreshAI': scheduleAI(true); toast(CONFIG.AI_ENABLED && CONFIG.AI_PROVIDER !== 'rules' ? 'Refreshing AI insights…' : 'Insights refreshed from live metadata.'); break;
        case 'copyJSON': {
          const sum = S ? buildSummary(S, activeFilterDesc()) : {};
          const txt = JSON.stringify(sum, null, 2);
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(() => { });
          toast('Structured summary copied to clipboard.');
          return;
        }
        case 'aiTest': {
          AI_STATE.status = 'Testing connection…'; renderSide();
          const provider = createProvider({ ...CONFIG, AI_ENABLED: true });
          if (!provider) { AI_STATE.status = 'Rules engine only — no external model is called.'; renderSide(); return; }
          provider.ping().then(models => {
            AI_STATE.status = `Connected. ${models.length ? 'Models available: ' + models.slice(0, 6).join(', ') + (models.length > 6 ? '…' : '') : 'Endpoint reachable.'}`;
            renderSide();
          }).catch(err => {
            AI_STATE.status = 'Could not reach the endpoint. ' + (err.name === 'AbortError' ? 'Request timed out.' : err.message + '. If using Ollama, set OLLAMA_ORIGINS to allow browser requests.');
            renderSide();
          });
          return;
        }
        case 'aiApply': scheduleAI(true); toast('AI settings applied.'); break;
        case 'nav': {
          if (btn.dataset.home) { state.view = 'dashboard'; state.panel = null; break; }
          toast(`${btn.dataset.label} is outside this prototype.`);
          return;
        }
        default: return;
      }
      render();
    }

    /* ==========================================================
       21. CHANGE / INPUT HANDLERS
       ========================================================== */
    const searchTimers = {};
    function debounced(key, fn, ms = 180) { clearTimeout(searchTimers[key]); searchTimers[key] = setTimeout(fn, ms); }

    function handleChange(el) {
      const k = el.dataset.change;
      switch (k) {
        case 'owner': state.owner = el.value; resetPage('reg'); render(); break;
        case 'dept': state.dept = el.value; resetPage('reg'); render(); break;
        case 'holdOnly': state.holdOnly = el.checked; resetPage('reg'); render(); break;
        case 'per': { const scope = el.dataset.scope; state[scope].per = Number(el.value); state[scope].page = 1; render(); break; }
        case 'col': {
          const col = el.dataset.col, cols = state.rep.cols.slice();
          if (el.checked) { if (!cols.includes(col)) { REG_COLS.forEach(k2 => { if (k2 === col && !cols.includes(k2)) cols.push(k2); }); } }
          else { const i = cols.indexOf(col); if (i > -1) cols.splice(i, 1); }
          state.rep.cols = REG_COLS.filter(k2 => cols.includes(k2));
          render(); break;
        }
        case 'aiProv': CONFIG.AI_PROVIDER = el.value; if (el.value === 'rules') CONFIG.AI_ENABLED = false; else CONFIG.AI_ENABLED = true; AI_STATE.status = ''; render(); break;
        case 'aiEnabled': CONFIG.AI_ENABLED = el.checked; render(); break;
        default: break;
      }
    }
    function handleInput(el) {
      const k = el.dataset.input;
      if (k === 'regSearch') { debounced('reg', () => { state.reg.search = el.value; state.reg.page = 1; render(); }); return; }
      if (k === 'repSearch') { debounced('rep', () => { state.rep.search = el.value; state.rep.page = 1; render(); }); return; }
      if (k === 'aiModel') { CONFIG.AI_MODEL = el.value; return; }
      if (k === 'aiBase') { CONFIG.AI_BASE_URL = el.value; return; }
    }

    /* ==========================================================
       22. WIRING
       ========================================================== */
    function wireEvents() {
      tipEl = $('#tip');

      document.addEventListener('click', e => {
        const insideMenu = e.target.closest('.menu-wrap') || e.target.closest('#floatMenu');
        const btn = e.target.closest('[data-act]');
        if (!insideMenu && state.openMenu) { state.openMenu = null; render(); }
        if (btn) handleAction(btn, e);
      });

      document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.change) handleChange(e.target); });
      document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.input) handleInput(e.target); });

      const gs = $('#globalSearch');
      if (gs) gs.addEventListener('input', () => debounced('global', () => { state.search = gs.value; resetPage('reg'); render(); }));

      document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
      document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
      document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
      document.addEventListener('focusout', e => { const el = e.target.closest('[data-tip]'); if (el) hideTip(); });
      window.addEventListener('scroll', hideTip, true);
      window.addEventListener('resize', () => { hideTip(); hideFloatMenu(); });

      document.addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.section-heading[role="button"]')) {
          e.preventDefault();
          handleAction(e.target, e);
          return;
        }
        if (e.key === 'Escape') {
          if (floatMenuOpen) { hideFloatMenu(); return; }
          if (state.openMenu) { state.openMenu = null; render(); return; }
          if (state.panel) { state.panel = null; render(); return; }
          if (state.view === 'report') { state.view = 'dashboard'; render(); }
        }
      });
    }

    /* ==========================================================
       23. INIT
       ========================================================== */
    async function init() {
      wireEvents();
      DOCS = await DataSource.load();
      DOCS.forEach(derive);
      DOC_BY_ID = new Map(DOCS.map(d => [d.id, d]));
      render();
    }
    document.addEventListener('DOMContentLoaded', init);

  </script>
</body>
